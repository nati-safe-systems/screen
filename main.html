<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>נתי SAFE — מסך ראשי</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;800;900&family=Heebo:wght@300;400;500;700;800;900&family=Rubik:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700;1,900&family=Suez+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:Assistant,Arial,sans-serif;background:#05070e;color:#e6edf3;direction:rtl;display:flex;flex-direction:column}
.hdr{background:#7a0000;color:#fff;text-align:center;padding:1vh 0;font-size:2.4vh;font-weight:800;
  border-bottom:2px solid #ffcc00;flex-shrink:0}
.main{flex:1;min-height:0;display:flex}
.col{width:23%;min-width:0;background:linear-gradient(180deg,#0d1526,#070c16);
  display:flex;flex-direction:column;padding:1.2vh 1vw;gap:.8vh;overflow:hidden}
.col.r{border-left:2px solid rgba(255,204,0,.3)}
.col.l{border-right:2px solid rgba(255,204,0,.3)}
#clock{text-align:center;color:#ffd227;font-size:7.4vh;font-weight:800;line-height:1;
  letter-spacing:.02em;font-variant-numeric:tabular-nums;
  text-shadow:0 0 3vh rgba(255,204,0,.5),0 .3vh 1vh rgba(0,0,0,.6)}
#clock .sec{font-size:.45em;color:#c99a2e;font-weight:700;vertical-align:.55em;
  margin-right:.15em;letter-spacing:0}
.dt{text-align:center;color:#a3d1ff;font-size:2vh;font-weight:700}
.dt2{text-align:center;color:#8fb4dd;font-size:1.5vh}
.par{background:rgba(255,255,255,.05);border:1px solid rgba(255,204,0,.35);border-radius:1vh;
  padding:.6vh;text-align:center;color:#fff;font-size:2.1vh;font-weight:700;margin:.8vh 0}
.bt{color:#ffcc00;font-size:1.8vh;font-weight:800;border-bottom:1px solid rgba(255,204,0,.35);
  padding-bottom:.3vh;margin-bottom:.5vh;letter-spacing:.05vh}
.list{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;min-height:0}
.zr{display:flex;justify-content:space-between;font-size:2vh;color:#fff;padding:.25vh 0;
  border-bottom:1px solid rgba(255,255,255,.07)}
.zr b{color:#00ff88;font-weight:800;font-variant-numeric:tabular-nums}
.warn{color:#ff5555;font-size:1.3vh;text-align:center;margin-top:.4vh}
#mlist{display:flex;flex-direction:column;gap:1vh;justify-content:space-evenly}
.room{background:linear-gradient(160deg,rgba(22,34,60,.95),rgba(11,18,34,.95));
  border:1px solid rgba(140,180,230,.28);border-radius:1.2vh;padding:.9vh 1vw;
  display:flex;flex-direction:column;gap:.45vh;min-height:0}
.room .rn{color:#ffcc00;font-size:2.4vh;font-weight:900;font-family:"Frank Ruhl Libre",serif;
  text-align:center;border-bottom:1px solid rgba(255,204,0,.3);padding-bottom:.3vh;margin-bottom:.2vh}
.prow{display:flex;align-items:center;gap:.5vw;justify-content:space-between}
.prow>span{color:#9fc0e4;font-weight:800;font-size:1.75vh;white-space:nowrap;min-width:4.5em}
.prow>b{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.3vw .35vw;
  justify-items:stretch;font-weight:400;flex:1}
.prow i{font-style:normal;color:#00ff88;font-size:1.85vh;font-weight:800;text-align:center;
  font-variant-numeric:tabular-nums;background:rgba(0,255,136,.08);
  border:1px solid rgba(0,255,136,.22);border-radius:.5vh;padding:.1vh .3vw}
.prow i.nx{color:#161b22;background:#ffd86b;border-color:#ffd86b;
  box-shadow:0 0 1.6vh rgba(255,204,0,.5)}
.prow i.roll{grid-column:1/-1;color:#ffb37a;background:rgba(255,140,60,.1);border-color:rgba(255,140,60,.3)}
.center{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
.ttl{background:rgba(50,0,0,.93);padding:1.6vh;text-align:center;flex-shrink:0;position:relative;z-index:2}
.ttl small{display:block;color:rgba(255,204,0,.6);font-size:1.5vh;letter-spacing:.3vh}
.ttl b{display:block;color:#ffcc00;font-size:4.4vh;font-family:"Frank Ruhl Libre",serif;margin-top:.3vh}
.ann{flex:1;min-height:0;position:relative;z-index:2;margin:1.4vh;padding:1.6vh 1.8vw;overflow:hidden;
  background:rgba(0,0,0,.42);border:1px solid rgba(255,204,0,.3);border-radius:1.2vh;
  display:flex;flex-direction:column;gap:1.2vh}
.ann h3{color:#ffcc00;font-size:2.4vh;border-bottom:1px solid rgba(255,204,0,.3);padding-bottom:.5vh;flex-shrink:0}
.aitem{border-right:.4vh solid rgba(255,204,0,.6);padding:0 1vw .2vh 0}
.aitem .at{color:#fff;font-size:2.6vh;font-weight:800}
.aitem .ab{color:#cfe0f2;font-size:2vh;margin-top:.2vh;line-height:1.4}
.none{color:#6e7f95;font-size:2.2vh;text-align:center;margin:auto}
.ft{flex-shrink:0;border-top:1px solid rgba(255,255,255,.12);padding:.8vh;display:flex;
  align-items:center;justify-content:center;gap:1vw;color:rgba(255,255,255,.7);font-size:1.7vh}
.ft b{color:#ffcc00}
.fl{height:4.6vh;opacity:.95;filter:drop-shadow(0 0 .7vh rgba(255,204,0,.35))}
#bgimg{position:absolute;inset:0;z-index:0;overflow:hidden}
.bgslide{position:absolute;inset:0;background-size:cover;background-position:center;
  opacity:0;transition:opacity 1.8s ease-in-out}
.bgslide.on{opacity:1}
#bgveil{position:absolute;inset:0;background:rgba(4,8,18,.74);z-index:1}
@media (max-aspect-ratio:1/1){ .main{flex-direction:column} .col{width:100%} }

/* ===== טיפוגרפיה — נתי SAFE ===== */
:root{
  --f-body:"Heebo","Assistant",Arial,sans-serif;
  --f-disp:"Frank Ruhl Libre","David Libre",serif;
  --f-num:"Rubik","Heebo",Arial,sans-serif;
  --gold:#ffd227; --gold-soft:#ffe9a8;
}
body{font-family:var(--f-body)!important;-webkit-font-smoothing:antialiased}
.num,#clock,.topbar .clk,.tm,.cd,.big,.at,.zr b,.prow i,.mt,.mt b{
  font-family:var(--f-num)!important;font-feature-settings:"tnum" 1;font-variant-numeric:tabular-nums}
/* השעון — מוטה קלות, נותן תחושת תנועה ויוקרה */
#clock,.topbar .clk{
  font-family:var(--f-num)!important;font-weight:800!important;
  transform:skewX(-6deg);display:inline-block;
  background:linear-gradient(180deg,#d9ffe9 0%,#00ff88 45%,#00a85c 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 .25vh .8vh rgba(0,0,0,.55)) drop-shadow(0 0 2.4vh rgba(0,255,136,.4))}
#clock .sec,.topbar .clk .sec,.topbar .clk .sec2{
  font-size:.4em!important;-webkit-text-fill-color:#5fbf90;background:none;filter:none;
  vertical-align:.62em;margin-right:.14em;font-weight:700}
/* כותרות — סריף כבד עם עומק */
.head h1,.ttl b,.bigttl,.mcard .rn,.room .rn,.sc .nm,.cdwrap .pray,.hdr{
  font-family:var(--f-disp)!important}
.head h1,.ttl b,.bigttl{
  background:linear-gradient(180deg,#fff3c9 0%,#ffcc00 55%,#c98f10 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 .3vh 1vh rgba(0,0,0,.65))}
.hdr{font-family:var(--f-body)!important;letter-spacing:.06em}
/* כרטיסים — עומק עדין */
.mcard,.room,.sc,.ann{box-shadow:0 .6vh 2.2vh rgba(0,0,0,.45),inset 0 .1vh 0 rgba(255,255,255,.06)}

</style></head><body>

  <div class="col r">
    <div id="clock">--:--</div>

function resolveSite(cb){
  var q;
  if(SITE_ID) q=Promise.resolve(SITE_ID);
  else if(SCREEN_ID) q=sf("screens?screen_id=eq."+encodeURIComponent(SCREEN_ID)+"&select=site_id,display_config")
      .then(function(r){ if(!r||!r[0])return null;
        try{var dc=r[0].display_config; if(typeof dc==="string")dc=JSON.parse(dc);
            if(dc){var im=Array.isArray(dc.bg_images)?dc.bg_images:(dc.bg_url?[dc.bg_url]:[]);
                   if(im.length) setBg(im,dc.bg_sec);}}catch(e){}
        return r[0].site_id; });
  else q=sf("sites?select=id&order=name&limit=1").then(function(r){return r&&r[0]?r[0].id:null;});
  q.then(cb).catch(function(e){console.error(e);});
}

var SITE=null,ROOMS=[],MINS=[],ANN=[],Z=null,ZDAY="";
var PR={selichot:"סליחות",shacharit:"שחרית",mussaf:"מוסף",mincha:"מנחה",arvit:"ערבית",maariv:"מעריב",unassigned:"טרם הוגדר",other:"תפילה"};

function load(){
  resolveSite(function(sid){
    if(!sid){ document.getElementById("siteName").textContent="לא הוגדר אתר למסך זה"; return; }
    SITE_ID=sid;
    var t=new Date(), iso=t.getFullYear()+"-"+p2(t.getMonth()+1)+"-"+p2(t.getDate());
    Promise.all([
      sf("sites?id=eq."+sid+"&select=*"),
      sf("rooms?site_id=eq."+sid+"&select=*&active=eq.true&order=sort_order"),
      sf("prayer_times?site_id=eq."+sid+"&select=*&active=eq.true"),
      sf("announcements?site_id=eq."+sid+"&select=*&active=eq.true&date_from=lte."+iso+"&date_to=gte."+iso+"&order=priority")
    ]).then(function(r){
      SITE=r[0][0]; ROOMS=r[1]||[]; MINS=r[2]||[]; ANN=r[3]||[];
      document.getElementById("siteName").textContent=SITE?SITE.name:"";
      try{ NatiAlerts.init({supa:SB,key:SK,areas:(SITE&&SITE.alert_areas)||[]}); }catch(e){}
      document.getElementById("ttlName").textContent=SITE?SITE.name:"";
      ZDAY=""; tick(); drawAnn();
    });
  });
}
function zmans(now){
  var k=now.toDateString();
  if(k!==ZDAY&&SITE){ Z=NatiZmanim.getZmanim(now,{lat:+SITE.lat,lng:+SITE.lng,elevation:+SITE.elevation,
      candleMinutes:+SITE.candle_offset||40,timeZone:SITE.timezone||"Asia/Jerusalem"}); ZDAY=k; }
  return Z;
}
function drawAnn(){
  var e=document.getElementById("ann");
  if(!ANN.length){ e.innerHTML='<div class="none">אין הודעות כרגע</div>'; return; }
  e.innerHTML='<h3>הודעות לציבור</h3>'+ANN.map(function(a){
    return '<div class="aitem"><div class="at">'+esc(a.title)+'</div>'+
      (a.body?'<div class="ab">'+esc(a.body).replace(/\n/g,"<br>")+'</div>':'')+'</div>';
  }).join("");
}
function drawMinyanim(now,nowMin){
  var out="";
  ROOMS.filter(function(r){return r.kind==="shul";}).forEach(function(r){
    var rows=MINS.filter(function(m){return m.room_id===r.id||!m.room_id;});
    var list=NatiMinyan.resolve(rows,Z,now,{});
    if(!list.length)return;
    var nx=NatiMinyan.next(list,nowMin), g=NatiMinyan.byPrayer(list), rh="";
    /* סדר קבוע, כדי שהתפילות תמיד יופיעו באותו סדר */
    ["selichot","shacharit","mussaf","mincha","arvit","maariv","other"].forEach(function(pk){
      var arr=g[pk]; if(!arr||!arr.length)return;
      var cells;
      if(arr[0].rolling){
        /* מנחה רצופה — לא מציגים כל שעה, אלא את החלון */
        var stp=arr[0].step||(arr.length>1?Math.round(arr[1].minutes-arr[0].minutes):0);
        cells='<i class="roll">'+(stp?'כל '+stp+' דק\' · ':'')+
              arr[0].time+' — '+arr[arr.length-1].time+'</i>';
      }else{
        cells=arr.map(function(x){
          return '<i'+(nx&&x.minutes===nx.minutes?' class="nx"':'')+'>'+x.time+'</i>';
        }).join("");
      }
      rh+='<div class="prow"><span>'+(PR[pk]||pk)+'</span><b>'+cells+'</b></div>';
    });
    out+='<div class="room"><div class="rn">'+esc(r.display_name||r.name)+'</div>'+rh+'</div>';
  });
  document.getElementById("mlist").innerHTML=out||'<div class="none">לא הוגדרו מניינים</div>';
}
/* בדיקה: ?mdebug=1 — מציג כל שורת מניין ומה קרה לה */
function mdebug(now){
  var box=document.getElementById("mdbg");
  if(!box){ box=document.createElement("div"); box.id="mdbg";
    box.style.cssText="position:fixed;inset:0;z-index:99999;background:#0d1117;color:#e6edf3;"+
      "font:12px/1.5 Assistant,Arial,sans-serif;direction:rtl;overflow:auto;padding:14px;";
    document.body.appendChild(box); }
  var h='<b style="color:#ffcc00;font-size:15px">בדיקת מניינים</b><br>'+
        'שורות שנטענו מהמסד: <b>'+MINS.length+'</b> · חדרים: <b>'+ROOMS.length+'</b><br><br>'+
        '<table style="border-collapse:collapse;font-size:12px"><tr style="background:#161b22">'+
        ['תפילה','חדר','מצב','פרטים','פעיל','ימים','נפתר ל'].map(function(t){
          return '<th style="padding:4px 8px;text-align:right">'+t+'</th>';}).join('')+'</tr>';
  var roomName={}; ROOMS.forEach(function(r){roomName[r.id]=r.display_name||r.name;});
  MINS.forEach(function(m){
    var res=NatiMinyan.resolve([m],Z,now,{});
    var det = m.mode==="fixed" ? ("שעה "+(m.fixed_time||"—"))
      : m.mode==="relative" ? ((m.rel_zman||"—")+" "+(m.rel_offset_min||0))
      : ("כל "+(m.interval_min||"—")+" דק' · "+(m.interval_start_zman||m.interval_start||"—")+
         " "+(m.interval_start_offset||0)+" → "+(m.interval_end_zman||m.interval_end||"—")+
         " "+(m.interval_end_offset||0));
    var ok=res.length;
    h+='<tr style="border-top:1px solid #21262d">'+
       '<td style="padding:3px 8px">'+(m.prayer||"—")+'</td>'+
       '<td style="padding:3px 8px">'+(m.room_id?(roomName[m.room_id]||"חדר לא מוכר!"):"כל החדרים")+'</td>'+
       '<td style="padding:3px 8px">'+(m.mode||"—")+'</td>'+
       '<td style="padding:3px 8px;color:#8b949e">'+det+'</td>'+
       '<td style="padding:3px 8px;color:'+(m.active===false?"#ff6b6b":"#3fb950")+'">'+(m.active===false?"לא":"כן")+'</td>'+
       '<td style="padding:3px 8px;color:#8b949e">'+(Array.isArray(m.days_of_week)?m.days_of_week.join(","):"—")+'</td>'+
       '<td style="padding:3px 8px;color:'+(ok?"#3fb950":"#ff6b6b")+'">'+
         (ok?(res.length+" שעות · "+res[0].time+" עד "+res[res.length-1].time):"לא נפתר")+'</td></tr>';
  });
  box.innerHTML=h+'</table><div style="margin-top:14px;color:#8b949e">להסתרה: הסר ?mdebug=1</div>';
}

function tick(){
  var now=new Date(), h=now.getHours(), m=now.getMinutes(), sc=now.getSeconds();
  document.getElementById("clock").innerHTML=p2(h)+":"+p2(m)+'<span class="sec">'+p2(sc)+'</span>';
  document.getElementById("greg").textContent=now.toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  if(!SITE)return;
  zmans(now);
  document.getElementById("heb").textContent=NatiHebDate.format(now,{shkiaMinutes:Z?Z.shkia:null});
  var nowMin=h*60+m+sc/60;
  document.getElementById("zlist").innerHTML=
    [["עלות השחר",Z.alotHashachar],["נץ החמה",Z.netz],['סו"ז ק"ש מג"א',Z.sofZmanShmaMGA],
     ['סו"ז ק"ש גר"א',Z.sofZmanShmaGRA],['סו"ז תפילה',Z.sofZmanTfilaGRA],["חצות",Z.chatzot],
     ["מנחה גדולה",Z.minchaGedola],["פלג המנחה",Z.plagHamincha],["שקיעה",Z.shkia],
     ["צאת הכוכבים",Z.tzeitHakochavim],["רבינו תם",Z.tzeitRT]]
    .map(function(x){return '<div class="zr"><span>'+x[0]+'</span><b>'+NatiMinyan.fmt(x[1])+'</b></div>';}).join("");
  drawMinyanim(now,nowMin);
  if(new URLSearchParams(location.search).get("mdebug")==="1"){
    if(!window._mdt||Date.now()-window._mdt>5000){ window._mdt=Date.now(); try{ mdebug(now); }catch(e){} }
  }
}
setInterval(tick,1000);
setInterval(function(){ZDAY="";load();},5*60*1000);
load(); tick();
</script></body></html>
