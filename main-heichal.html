<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'David Libre',Georgia,serif;direction:rtl;color:#2b2115;
  background:
    radial-gradient(ellipse at 50% 26%, #fdf7e7 0%, #f0e4c8 42%, #ddcaa4 72%, #bfa478 100%);
  display:flex;flex-direction:column;position:relative}

/* ---------- מרקם דמאסק עדין ---------- */
#vig{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 38%,transparent 40%,rgba(96,66,28,.3) 100%)}
#tex{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.075;
  background-repeat:repeat;background-size:13vh 13vh}

/* ---------- וילון עליון ---------- */
#curtain{position:fixed;top:0;left:0;right:0;height:9.5vh;z-index:6;
  filter:drop-shadow(0 .6vh 1.2vh rgba(70,50,20,.45));
  pointer-events:none;background:no-repeat center/100% 100%}

/* ---------- עמודים ---------- */
.col-l,.col-r{position:fixed;top:8.6vh;bottom:5.4vh;width:6.2vh;z-index:5;
  pointer-events:none;background:no-repeat center/100% 100%}
.col-r{right:.8vh}.col-l{left:.8vh}

/* ---------- מסגרת חיצונית ---------- */
#frame{position:fixed;inset:.9vh;z-index:4;pointer-events:none;
  border:.5vh solid transparent;
  border-image:linear-gradient(145deg,#f6e7bd,#c9a24a 30%,#7f6119 55%,#c9a24a 78%,#f6e7bd) 1}
#frame2{position:fixed;inset:1.9vh;z-index:4;pointer-events:none;
  border:.14vh solid rgba(127,97,25,.5)}

/* ---------- פריסה ---------- */
.wrap{flex:1;min-height:0;display:flex;gap:1vw;
  padding:10.4vh 7.6vh 5.2vh;position:relative;z-index:2}
.side{width:29%;min-width:0;display:flex;flex-direction:column;gap:1.1vh;min-height:0}
.center{flex:1;min-width:0;display:flex;flex-direction:column;gap:1.1vh;align-items:center;min-height:0}

/* ---------- שלט כותרת מגולף ---------- */
.plaque{position:relative;align-self:center;padding:.6vh 3.2vw;
  background:linear-gradient(180deg,#3b2a0e 0%,#241806 55%,#150e03 100%);
  border:.18vh solid #c9a24a;border-radius:.6vh;
  box-shadow:0 .35vh .9vh rgba(80,60,20,.35), inset 0 .1vh 0 rgba(246,231,189,.25);
  color:#f6e7bd;font-family:"Frank Ruhl Libre",serif;font-weight:700;
  font-size:2.5vh;letter-spacing:.04em;white-space:nowrap;z-index:3}
.plaque::before,.plaque::after{content:"";position:absolute;top:50%;width:2.6vh;height:2.6vh;
  transform:translateY(-50%);background:no-repeat center/contain}
.plaque::before{right:-1.3vh}
.plaque::after{left:-1.3vh;transform:translateY(-50%) scaleX(-1)}

/* ---------- לוח ---------- */
.panel{background:
    radial-gradient(ellipse at 50% 0%, rgba(255,252,244,.95), rgba(246,237,215,.95) 60%),
    linear-gradient(165deg,#fdf8ea,#ecdfc0);
  border:.24vh solid #a5842f;border-radius:1.4vh;
  box-shadow:0 1vh 2.6vh rgba(80,58,24,.3),
             inset 0 0 0 .12vh rgba(255,255,255,.85),
             inset 0 .3vh .8vh rgba(255,255,255,.6),
             inset 0 -.6vh 1.6vh rgba(150,115,55,.18),
             inset 0 0 4vh rgba(160,125,60,.1);
  padding:2.2vh 1.4vw 1.4vh;position:relative;display:flex;flex-direction:column;
  min-height:0;margin-top:1.3vh}
.panel>.plaque{position:absolute;top:-1.5vh;left:50%;transform:translateX(-50%)}
.panel>.plaque::after{transform:translateY(-50%) scaleX(-1)}
.panel .body{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;
  justify-content:space-evenly}

/* ---------- שורות זמנים ---------- */
.row{display:flex;justify-content:space-between;align-items:baseline;gap:.6vw;
  padding:.24vh .2vw;border-bottom:.1vh dotted rgba(120,95,40,.35)}
.row:last-child{border-bottom:none}
.row .lbl{color:#3a2d18;font-weight:700;font-size:calc(var(--k,1) * 2.2vh)}
.row .val{color:#1d4d2e;font-weight:700;font-size:calc(var(--k,1) * 2.3vh);
  font-variant-numeric:tabular-nums;font-family:'Miriam Libre',Heebo,sans-serif}
.row.next .val{color:#8a1414;font-size:calc(var(--k,1) * 2.5vh)}
.row.next .lbl{color:#8a1414}

/* חדר */
.room{margin-bottom:.5vh}
.room .rn{color:#6b1d1d;font-family:"Frank Ruhl Libre",serif;font-weight:900;
  text-shadow:0 .08vh 0 rgba(255,255,255,.85);
  font-size:calc(var(--k,1) * 2.5vh);text-align:center;
  border-bottom:.12vh solid rgba(140,110,40,.5);padding-bottom:.2vh;margin-bottom:.3vh}
.times{display:flex;direction:ltr;flex-wrap:wrap;gap:.2vh .7vw;justify-content:center}
.times span{color:#1d4d2e;font-weight:700;font-size:calc(var(--k,1) * 2.1vh);
  font-variant-numeric:tabular-nums;opacity:.85}
.times span.past{opacity:.35}
.times span.next{color:#8a1414;font-weight:700;font-size:calc(var(--k,1) * 3vh);opacity:1;
  font-family:"Miriam Libre",sans-serif}

/* ---------- מרכז ---------- */
.crest{background:
    radial-gradient(ellipse at 50% 0%, rgba(255,252,244,.96), rgba(243,232,206,.96)),
    linear-gradient(165deg,#fdf8ea,#e9dbb8);
  border:.24vh solid #a5842f;border-radius:1.2vh;padding:1.3vh 1.6vw;text-align:center;
  box-shadow:0 1vh 2.4vh rgba(80,58,24,.3),inset 0 0 0 .12vh rgba(255,255,255,.85),
             inset 0 -.6vh 1.4vh rgba(150,115,55,.16);width:100%}
.crest .site{color:#6b1d1d;font-family:"Frank Ruhl Libre",serif;font-weight:900;
  font-size:3.6vh;line-height:1.15;text-shadow:0 .1vh 0 rgba(255,255,255,.9),0 .3vh .6vh rgba(120,85,30,.28)}
.crest img{max-height:9vh;max-width:80%;object-fit:contain;margin-top:.6vh}
#clock{color:#6b1d1d;font-family:'Miriam Libre',Heebo,sans-serif;font-weight:700;font-size:7.6vh;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:.02em;
  text-shadow:0 .12vh .3vh rgba(120,90,30,.35)}
#clock .sec{font-size:.42em;color:#9a7a3a;vertical-align:.6em;margin-right:.14em}
.dates{color:#4a3c22;font-size:2vh;font-weight:700;margin-top:.3vh}
.dates .g{display:block;color:#6d5a34;font-size:1.5vh;font-weight:500;margin-top:.15vh}
.ann{flex:1;min-height:0;width:100%}
.ann .item{border-right:.35vh solid #c9a24a;padding:0 .8vw .5vh 0;margin-bottom:.7vh}
.ann .t{color:#6b1d1d;font-family:"Frank Ruhl Libre",serif;font-weight:800;
  text-shadow:0 .08vh 0 rgba(255,255,255,.85);

.ann .b{color:#4a3c22;font-size:calc(var(--ak,1) * 1.8vh);line-height:1.35}
.none{color:#8a7a58;font-size:1.9vh;text-align:center;margin:auto}

/* ---------- תחתית ---------- */
.foot{flex-shrink:0;position:relative;z-index:3;display:flex;align-items:center;
  justify-content:center;gap:1vw;padding:.5vh 0 1.4vh;color:#5a4a2a;font-size:1.6vh}
.foot b{color:#6b1d1d}
.foot img{height:4.2vh;opacity:.9}
.bsd{position:fixed;top:10.6vh;right:8.6vh;z-index:7;color:#6b1d1d;
  font-family:"Frank Ruhl Libre",serif;font-weight:700;font-size:2vh;
  text-shadow:0 .08vh 0 rgba(255,255,255,.9)}
#ver{position:fixed;bottom:2.4vh;right:3.4vh;z-index:9;font-size:1.1vh;color:rgba(90,70,30,.5)}
.warn{color:#8a1414;font-size:1.3vh;text-align:center;margin-top:.3vh}
@media (max-aspect-ratio:1/1){ .wrap{flex-direction:column} .side{width:100%} }

<script>/* =====================================================================
   נתי SAFE — מנוע זמנים הלכתיים
   zmanim-engine.js  ·  v1.0
   ---------------------------------------------------------------------
   מנוע עצמאי לחלוטין. אפס תלויות, אפס קריאות רשת, אפס API.
   מחושב לפי אלגוריתם NOAA Solar Position (דיוק שניות).

   מכויל מול הלוח הספירלי (אופק בית שמש), אלול תשפ"ו / אוגוסט-ספטמבר 2026.
   תוצאת הכיול: 14/14 התאמה מדויקת בשקיעה, צאת הכוכבים, חצות,
   מנחה גדולה, הדלקת נרות ורבנו תם.

   השיטות שזוהו בלוח (מוקשחות כאן):
     שקיעה / הנץ מוצג  : זווית 90.8333° + תיקון גובה תצפית
     חצות              : מעבר שמש אסטרונומי (לא אמצע היום)
     שעות זמניות       : נץ→שקיעה במישור (גובה 0), לא בגובה
     סוף זמן ק"ש מ"א   : 19.8° (עלות ותצאת 19.8°)
     סוף זמן ק"ש מ"א 72: 16.1°
     צאת הכוכבים       : 8.5° במישור
     רבנו תם           : שקיעה (בגובה) + 72 דקות
     הדלקת נרות        : שקיעה (בגובה) − 40 דקות
   כל הזמנים נחתכים כלפי מטה לדקה שלמה (floor), כמו בלוח.
   ===================================================================== */

(function (root) {
  'use strict';

  var RAD = Math.PI / 180, DEG = 180 / Math.PI;
  var EARTH_R = 6356900;           // מ' — ערך KosherJava
  var Z_SUNSET = 90 + 50 / 60;     // 90.833333° — שקיעה/נץ עם רפרקציה

  /* ---------- אסטרונומיה ---------- */

  function julianDay(y, m, d) {
    if (m <= 2) { y -= 1; m += 12; }
    var A = Math.floor(y / 100), B = 2 - A + Math.floor(A / 4);
    return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5;
  }
  function jc(jd) { return (jd - 2451545.0) / 36525.0; }

  function meanLong(t) { var L = 280.46646 + t * (36000.76983 + t * 0.0003032); return ((L % 360) + 360) % 360; }
  function meanAnom(t) { return 357.52911 + t * (35999.05029 - 0.0001537 * t); }
  function eccent(t) { return 0.016708634 - t * (0.000042037 + 0.0000001267 * t); }
  function eqCenter(t) {
    var m = meanAnom(t) * RAD;
    return Math.sin(m) * (1.914602 - t * (0.004817 + 0.000014 * t))
         + Math.sin(2 * m) * (0.019993 - 0.000101 * t)
         + Math.sin(3 * m) * 0.000289;
  }
  function appLong(t) {
    var o = meanLong(t) + eqCenter(t), om = 125.04 - 1934.136 * t;
    return o - 0.00569 - 0.00478 * Math.sin(om * RAD);
  }
  function oblCorr(t) {
    var s = 21.448 - t * (46.8150 + t * (0.00059 - t * 0.001813));
    return (23.0 + (26.0 + s / 60.0) / 60.0) + 0.00256 * Math.cos((125.04 - 1934.136 * t) * RAD);
  }
  function declination(t) {
    var e = oblCorr(t) * RAD, l = appLong(t) * RAD;
    return Math.asin(Math.sin(e) * Math.sin(l)) * DEG;
  }
  function eqTime(t) {
    var eps = oblCorr(t) * RAD, l0 = meanLong(t) * RAD, e = eccent(t), m = meanAnom(t) * RAD;
    var y = Math.tan(eps / 2); y *= y;
    return (y * Math.sin(2 * l0) - 2 * e * Math.sin(m) + 4 * e * y * Math.sin(m) * Math.cos(2 * l0)
      - 0.5 * y * y * Math.sin(4 * l0) - 1.25 * e * e * Math.sin(2 * m)) * DEG * 4.0;
  }

  /** תוספת מעלות מתחת לאופק בגלל גובה התצפית */
  function elevAdj(metres) {
    if (!metres || metres <= 0) return 0;
    return Math.acos(EARTH_R / (EARTH_R + metres)) * DEG;
  }

  function hourAngle(lat, decl, zenith) {
    var la = lat * RAD, de = decl * RAD, z = zenith * RAD;
    var c = (Math.cos(z) / (Math.cos(la) * Math.cos(de))) - Math.tan(la) * Math.tan(de);
    if (c < -1 || c > 1) return null;
    return Math.acos(c) * DEG;
  }

  /** אירוע שמש → דקות מחצות הלילה בשעון המקומי */
  function solarEvent(y, m, d, lat, lng, tzMin, zenith, isRise) {
    var jd = julianDay(y, m, d), t = jc(jd);
    var ha = hourAngle(lat, declination(t), zenith);
    if (ha === null) return null;
    var utc = 720 + 4 * (-lng - (isRise ? ha : -ha)) - eqTime(t);
    t = jc(jd + utc / 1440);
    ha = hourAngle(lat, declination(t), zenith);
    if (ha === null) return null;
    utc = 720 + 4 * (-lng - (isRise ? ha : -ha)) - eqTime(t);
    return utc + tzMin;
  }

  /** חצות אסטרונומי (מעבר שמש) */
  function solarNoon(y, m, d, lng, tzMin) {
    var jd = julianDay(y, m, d);
    var t = jc(jd + 0.5 + lng / 360);
    var n = 720 - 4 * lng - eqTime(t);
    t = jc(jd + n / 1440);
    n = 720 - 4 * lng - eqTime(t);
    return n + tzMin;
  }

  /* ---------- אזור זמן ---------- */

  /** היסט אמיתי בדקות מ-UTC לתאריך נתון, כולל שעון קיץ */
  function tzOffsetMinutes(date, timeZone) {
    try {
      var dtf = new Intl.DateTimeFormat('en-US', {
        timeZone: timeZone, hour12: false,
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
      var p = {}, parts = dtf.formatToParts(date);
      for (var i = 0; i < parts.length; i++) p[parts[i].type] = parts[i].value;
      var asUTC = Date.UTC(+p.year, p.month - 1, +p.day,
        p.hour === '24' ? 0 : +p.hour, +p.minute, +p.second);
      return Math.round((asUTC - Math.floor(date.getTime() / 1000) * 1000) / 60000);
    } catch (e) {
      return -date.getTimezoneOffset();
    }
  }

  /* ---------- פורמט ---------- */

  var QSEC = 15;
  /** עיגול ל-QSEC שניות ואז חיתוך לדקה — בדיוק כמו בלוח */
  function quant(m, q) {
    if (m === null || isNaN(m)) return m;
    q = (q === undefined) ? QSEC : q;
    if (!q) return m;
    return Math.round(m * 60 / q) * q / 60;
  }

  function fmt(mins, opt) {
    if (mins === null || isNaN(mins)) return '--:--';
    opt = opt || {};
    var total = opt.seconds ? Math.round(mins * 60) : Math.floor(mins) * 60;
    var h = Math.floor(total / 3600) % 24, r = total - Math.floor(total / 3600) * 3600;
    var mi = Math.floor(r / 60), se = r - mi * 60;
    var hh = opt.hour12 ? (h % 12 === 0 ? 12 : h % 12) : h;
    var s = (opt.pad === false ? hh : String(hh).padStart(2, '0')) + ':' + String(mi).padStart(2, '0');
    if (opt.seconds) s += ':' + String(se).padStart(2, '0');
    return s;
  }

  /* ---------- ברירות מחדל למיקומים ---------- */

  var PLACES = {
    jerusalem:  { name: 'ירושלים',   lat: 31.7683, lng: 35.2137, elevation: 754 },
    betshemesh: { name: 'בית שמש',   lat: 31.7500, lng: 34.9750, elevation: 214 }, // נקודת הייחוס של הלוח
    bneibrak:   { name: 'בני ברק',   lat: 32.0840, lng: 34.8330, elevation: 30  },
    telaviv:    { name: 'תל אביב',   lat: 32.0853, lng: 34.7818, elevation: 20  },
    haifa:      { name: 'חיפה',      lat: 32.7940, lng: 34.9896, elevation: 200 },
    beitar:     { name: 'ביתר עילית', lat: 31.6960, lng: 35.1180, elevation: 700 },
    modiin:     { name: 'מודיעין עילית', lat: 31.9310, lng: 35.0420, elevation: 320 },
    ashdod:     { name: 'אשדוד',     lat: 31.8040, lng: 34.6550, elevation: 30  },
    elad:       { name: 'אלעד',      lat: 32.0520, lng: 34.9520, elevation: 120 },
    safed:      { name: 'צפת',       lat: 32.9646, lng: 35.4960, elevation: 850 }
  };

  /* ---------- הגדרות שיטה (ניתנות לשינוי מהאדמין) ---------- */

  var DEFAULTS = {
    lat: 31.7683, lng: 35.2137, elevation: 754,
    timeZone: 'Asia/Jerusalem',
    candleMinutes: 40,        // הדלקת נרות לפני השקיעה
    tzeitDegrees: 8.5,        // צאת הכוכבים
    rtMinutes: 72,            // רבנו תם — דקות שוות אחרי השקיעה בגובה
    mgaDegrees: 19.8,         // מ"א ראשי
    mga72Degrees: 16.1,       // מ"א 72
    misheyakirDegrees: 11.5,  // משיכיר (לא אומת מול הלוח — ראה README)
    useElevationForShaot: false, // הלוח מחשב שעות זמניות במישור
    graHalfDay: false,        // ק"ש/תפילה גר"א לפי יום מלא (כפי שבלוח)
    quantizeSeconds: 15       // הלוח מעגל ל-15 שניות לפני החיתוך לדקה
  };

  /* ---------- החישוב הראשי ---------- */

  function getZmanim(date, cfg) {
    date = date || new Date();
    var c = {};
    for (var k in DEFAULTS) c[k] = DEFAULTS[k];
    if (cfg) for (var k2 in cfg) if (cfg[k2] !== undefined && cfg[k2] !== null) c[k2] = cfg[k2];

    var tzMin = tzOffsetMinutes(date, c.timeZone);

    // התאריך האזרחי המקומי (לא UTC) — קריטי, אחרת קופצים יום
    var loc = new Date(date.getTime() + tzMin * 60000);
    var Y = loc.getUTCFullYear(), M = loc.getUTCMonth() + 1, Dd = loc.getUTCDate();

    var zEl = Z_SUNSET + elevAdj(c.elevation);   // עם גובה
    var zMi = Z_SUNSET;                          // מישור

    function ev(zen, rise) { return solarEvent(Y, M, Dd, c.lat, c.lng, tzMin, zen, rise); }
    function deg(x, rise) { return ev(90 + x, rise); }

    var netzMishor = ev(zMi, true);
    var shkiaMishor = ev(zMi, false);
    var netzElev = ev(zEl, true);
    var shkiaElev = ev(zEl, false);
    var chatzot = solarNoon(Y, M, Dd, c.lng, tzMin);

    // שעה זמנית — לפי המישור (כפי שהלוח מחשב)
    var rS = c.useElevationForShaot ? netzElev : netzMishor;

var SCROLL=svg("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'>"+

document.head.appendChild(st);

/* ---------- נתונים ---------- */
var SITE=null,ROOMS=[],MINS=[],ANN=[],SPON=[],Z=null,ZDAY="";
var PR={selichot:"סליחות",shacharit:"שחרית",mussaf:"מוסף",mincha:"מנחה",
        arvit:"ערבית",maariv:"מעריב",other:"תפילה"};

function load(){
  var q;
  if(SITE_ID) q=Promise.resolve(SITE_ID);
  else if(SCREEN_ID) q=sf("screens?screen_id=eq."+encodeURIComponent(SCREEN_ID)+"&select=site_id")
        .then(function(r){return r&&r[0]?r[0].site_id:null;});
  else q=sf("sites?select=id&order=name&limit=1").then(function(r){return r&&r[0]?r[0].id:null;});

  q.then(function(sid){
    if(!sid){ document.getElementById("siteName").textContent="לא הוגדר אתר"; return; }
    SITE_ID=sid;
    var t=new Date(), iso=t.getFullYear()+"-"+p2(t.getMonth()+1)+"-"+p2(t.getDate());
    return Promise.all([
      sf("sites?id=eq."+sid+"&select=*"),
      sf("rooms?site_id=eq."+sid+"&select=*&active=eq.true&order=sort_order"),
      sf("prayer_times?site_id=eq."+sid+"&select=*&active=eq.true"),
      sf("announcements?site_id=eq."+sid+"&select=*&active=eq.true&date_from=lte."+iso+"&date_to=gte."+iso+"&order=priority"),
      sf("sponsors?site_id=eq."+sid+"&select=*&active=eq.true&date_from=lte."+iso+"&date_to=gte."+iso+"&order=priority")
    ]).then(function(r){
      SITE=r[0][0]; ROOMS=r[1]||[]; MINS=r[2]||[]; ANN=r[3]||[]; SPON=r[4]||[];
      document.getElementById("siteName").textContent=SITE?SITE.name:"";
      if(SITE&&SITE.logo_url){
        var lg=document.getElementById("logo"); lg.src=SITE.logo_url; lg.style.display="";
        document.getElementById("flogo").src=SITE.logo_url;
      }
      ZDAY=""; tick(); drawAnn(); drawSpon();
    });
  }).catch(function(e){console.error(e);});
}

function zmans(now){
  var k=now.toDateString();
  if(k!==ZDAY&&SITE){ Z=NatiZmanim.getZmanim(now,{lat:+SITE.lat,lng:+SITE.lng,
    elevation:+SITE.elevation,candleMinutes:+SITE.candle_offset||40,
    timeZone:SITE.timezone||"Asia/Jerusalem"}); ZDAY=k; }
  return Z;
}

function fit(box, varName, lo, hi){
  if(!box) return;
  var a=lo, b=hi, best=lo;
  for(var i=0;i<12;i++){
    var mid=(a+b)/2;
    box.style.setProperty(varName, mid);
    if(box.scrollHeight<=box.clientHeight+1){ best=mid; a=mid; } else { b=mid; }
  }
  box.style.setProperty(varName,best);
}

function drawAnn(){
  var e=document.getElementById("annBox");
  if(!ANN.length){ e.innerHTML='<div class="none">אין הודעות כרגע</div>'; return; }
  e.innerHTML=ANN.map(function(a){
    return '<div class="item"><div class="t">'+esc(a.title)+'</div>'+
      (a.body?'<div class="b">'+esc(a.body)+'</div>':'')+'</div>';
  }).join("");
  fit(e,"--ak",.7,1.3);
}

function drawSpon(){
  var e=document.getElementById("sponBox");
  var cur=SPON.filter(function(s){ return !s.scope || s.scope==="all" || s.scope==="main"; });
  if(!cur.length){ e.innerHTML='<div class="none">אין פרנסים להיום</div>'; return; }
  e.innerHTML=cur.map(function(s){
    return '<div class="room"><div class="rn">'+esc(s.category)+'</div>'+
      '<div style="text-align:center;color:#2b2115;font-weight:700;'+
      'font-size:calc(var(--k,1) * 2.1vh);font-family:\'Frank Ruhl Libre\',serif">'+
      esc(s.name)+'</div>'+
      (s.dedication?'<div style="text-align:center;color:#6d5a34;font-size:calc(var(--k,1) * 1.6vh)">'+
        esc(s.dedication)+'</div>':'')+'</div>';
  }).join("");
  fit(e,"--k",.6,1.2);
}

function drawMinyanim(now,nowMin){
  var out="";
  ROOMS.filter(function(r){return r.kind==="shul";}).forEach(function(r){
    var rows=MINS.filter(function(m){return m.room_id===r.id||!m.room_id;});
    var list=NatiMinyan.resolve(rows,Z,now,{});
    if(!list.length)return;
    var nx=NatiMinyan.next(list,nowMin), g=NatiMinyan.byPrayer(list), body="";
    ["selichot","shacharit","mussaf","mincha","arvit","maariv","other"].forEach(function(pk){
      var arr=g[pk]; if(!arr||!arr.length)return;
      var cells;
      if(arr[0].rolling){
        cells='<span>כל '+(arr[0].step||15)+' דק\' · '+arr[0].time+'—'+arr[arr.length-1].time+'</span>';
      }else{
        cells=arr.map(function(x){
          var cls=(nx&&x.minutes===nx.minutes)?"next":(x.minutes<nowMin?"past":"");
          return '<span class="'+cls+'">'+x.time+'</span>';
        }).join("");
      }
      body+='<div class="row"><span class="lbl">'+(PR[pk]||pk)+'</span>'+
            '<span class="times">'+cells+'</span></div>';
    });
    out+='<div class="room"><div class="rn">'+esc(r.display_name||r.name)+'</div>'+body+'</div>';
  });
  var box=document.getElementById("mlist");
  box.innerHTML=out||'<div class="none">לא הוגדרו מניינים</div>';
  fit(box,"--k",.62,1.2);
}

function tick(){
  var now=new Date(), h=now.getHours(), m=now.getMinutes(), s=now.getSeconds();
  document.getElementById("clock").innerHTML=p2(h)+":"+p2(m)+'<span class="sec">'+p2(s)+'</span>';
  document.getElementById("greg").textContent=
    now.toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  if(!SITE)return;
  zmans(now);
  document.getElementById("heb").textContent=NatiHebDate.format(now,{shkiaMinutes:Z?Z.shkia:null});
  var nowMin=h*60+m+s/60;

  var zb=document.getElementById("zlist");
  zb.innerHTML=[["עלות השחר",Z.alotHashachar],["נץ החמה",Z.netz],['סו"ז ק"ש מג"א',Z.sofZmanShmaMGA],
   ['סו"ז ק"ש גר"א',Z.sofZmanShmaGRA],['סו"ז תפילה',Z.sofZmanTfilaGRA],["חצות",Z.chatzot],
   ["מנחה גדולה",Z.minchaGedola],["פלג המנחה",Z.plagHamincha],["שקיעה",Z.shkia],
   ["צאת הכוכבים",Z.tzeitHakochavim]]
   .map(function(x){return '<div class="row"><span class="lbl">'+x[0]+'</span>'+
     '<span class="val">'+NatiMinyan.fmt(x[1])+'</span></div>';}).join("");
  fit(zb,"--k",.8,1.35);

  var sb=document.getElementById("shabBox");
  sb.innerHTML=[["הדלקת נרות",Z.candleLighting],["שקיעה",Z.shkia],
   ["צאת השבת",Z.tzeitHakochavim],["רבינו תם",Z.tzeitRT]]
   .map(function(x){return '<div class="row"><span class="lbl">'+x[0]+'</span>'+
     '<span class="val">'+NatiMinyan.fmt(x[1])+'</span></div>';}).join("");
  fit(sb,"--k",.8,1.35);

  drawMinyanim(now,nowMin);
}
setInterval(tick,1000);
setInterval(function(){ZDAY="";load();},5*60*1000);
load(); tick();
window.addEventListener("resize",function(){ try{ tick(); }catch(e){} });
</script></body></html>
