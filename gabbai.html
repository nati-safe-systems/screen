<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="שלט גבאי">
<title>שלט גבאי · נתי SAFE</title>
<link rel="icon" href="natisafe-logo.png">
<link rel="apple-touch-icon" href="app-icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#0a0e14;color:#eef2f7;font-family:Heebo,Arial,sans-serif;direction:rtl;
  min-height:100%;user-select:none;-webkit-user-select:none}
body{padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 18px)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top img{width:70px;height:auto}
.top .t{font-weight:900;font-size:19px;line-height:1.2}
.top .t small{display:block;font-weight:400;font-size:13px;color:#8fa0b5}
.pr{display:flex;gap:7px;flex-wrap:wrap;margin:4px 0 14px}
.pr button{flex:1 1 auto;min-width:64px;padding:10px 6px;border-radius:10px;border:1px solid #2a3441;
  background:#141b25;color:#cfd8e3;font:700 15px Heebo,Arial,sans-serif}
.pr button.on{background:#1f6feb;border-color:#58a6ff;color:#fff}
.hint{font-size:13px;color:#8fa0b5;margin:-6px 0 12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.grid.one{grid-template-columns:1fr}
.rb{position:relative;min-height:96px;border-radius:16px;border:2px solid #2a3441;
  background:linear-gradient(160deg,#18212d,#10161f);color:#fff;padding:12px 10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-family:Heebo,Arial,sans-serif;transition:transform .08s}
.rb:active{transform:scale(.96)}
.rb .n{font-size:30px;font-weight:900;color:#ffcc00;line-height:1}
.rb .nm{font-size:16px;font-weight:700;text-align:center;line-height:1.25}
.rb .st{font-size:12px;color:#8fa0b5;min-height:15px}
.rb.sent{border-color:#3fb950;background:linear-gradient(160deg,#0f8a3a,#0a5f29)}
.rb.sent .st{color:#d7ffe2;font-weight:700}
.rb.err{border-color:#f85149}
/* 1.3: הודעה פעילה — כפתור ביטול נפרד (לא על החדר עצמו, כדי שלא יבוטל בטעות) */
.cell{display:flex;flex-direction:column;gap:6px}
.cx{display:none;padding:9px;border-radius:10px;border:1px solid #f85149;background:#3a1416;color:#ffb4ae;font:800 14px Heebo,Arial,sans-serif}
.cell.live .cx{display:block}
.cell.live .rb{border-color:#3fb950;background:linear-gradient(160deg,#0f8a3a,#0a5f29)}
.cell.live .rb .st{color:#d7ffe2;font-weight:700}
.msg{margin-top:16px;text-align:center;color:#8fa0b5;font-size:13px;line-height:1.7}
.big{margin-top:40px;text-align:center;font-size:16px;line-height:1.8}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #2a3441;background:#141b25;color:#fff;
  font:16px Heebo,Arial,sans-serif;margin:10px 0;direction:ltr;text-align:center}
.go{width:100%;padding:13px;border:none;border-radius:10px;background:#1f6feb;color:#fff;font:800 16px Heebo,Arial,sans-serif}
/* 1.4: כניסה עם משתמש — בחירת בית כנסת ויציאה */
.out{margin-inline-start:auto;padding:7px 12px;border-radius:9px;border:1px solid #2a3441;background:#141b25;color:#cfd8e3;font:700 13px Heebo,Arial,sans-serif;white-space:nowrap}
.sites{display:flex;gap:7px;flex-wrap:wrap;margin:-4px 0 12px}
.sites button{flex:1 1 auto;padding:9px 8px;border-radius:10px;border:1px solid #2a3441;background:#141b25;color:#cfd8e3;font:700 14px Heebo,Arial,sans-serif}
.sites button.on{background:#7a5c12;border-color:#ffcc00;color:#fff}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =====================================================================
   שלט גבאי — כפתור לכל חדר. לחיצה מקפיצה על מסך הדלת של החדר:
   "תפילת ___ מתחילה כאן עכשיו". שם התפילה נבחר אוטומטית לפי השעה,
   ואפשר לבחור ידנית לפני הלחיצה.
   הקישור כולל קוד אתר (?k=...) — נשמר בטלפון אחרי הפתיחה הראשונה.
   ===================================================================== */
var SUPA="https://cxtrrejclkhqhkqbicmz.supabase.co";
var KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4dHJyZWpjbGtocWhrcWJpY216Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTk3MDksImV4cCI6MjA5NTU3NTcwOX0._7wB4YwrYEnK6hWuR6YqcFxRb05OLnWvOelIC-ahIEQ";
/* ---- איזו תפילה עכשיו — לפי השעה והשקיעה ----
   השקיעה מחושבת לפי מיקום (ברירת מחדל: בית שמש). עד 04:00 — ערבית
   (מניין מאוחר), עד 12:30 — שחרית, עד השקיעה — מנחה, אחריה — ערבית. */
function nsfSunset(d, lat, lon){
  var rad=Math.PI/180;
  var jd = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), 12)/864e5 + 2440587.5;
  var n = Math.round(jd - 2451545.0 + 0.0008);
  var J = n - lon/360;
  var M = (357.5291 + 0.98560028*J) % 360;
  var C = 1.9148*Math.sin(M*rad) + 0.02*Math.sin(2*M*rad) + 0.0003*Math.sin(3*M*rad);
  var L = (M + C + 180 + 102.9372) % 360;
  var Jt = 2451545 + J + 0.0053*Math.sin(M*rad) - 0.0069*Math.sin(2*L*rad);
  var dec = Math.asin(Math.sin(L*rad)*Math.sin(23.44*rad));
  var w = Math.acos((Math.sin(-0.833*rad) - Math.sin(lat*rad)*Math.sin(dec)) / (Math.cos(lat*rad)*Math.cos(dec)));
  var Jset = Jt + (w/rad)/360;
  return new Date((Jset - 2440587.5)*864e5);
}
function nsfPrayerNow(d, lat, lon){
  d = d || new Date();
  var h = d.getHours() + d.getMinutes()/60;
  if(h < 4) return "ערבית";
  if(h < 12.5) return "שחרית";
  var ss = nsfSunset(d, lat==null?31.7470:lat, lon==null?34.9883:lon);
  return (d < ss) ? "מנחה" : "ערבית";
}

var app=document.getElementById("app");
var qp=new URLSearchParams(location.search);
var CODE=qp.get("k")||"";
try{ if(CODE) localStorage.setItem("nsf_gabbai_k",CODE); else CODE=localStorage.getItem("nsf_gabbai_k")||""; }catch(e){}
var PRAYER="auto";
var SITE={nusach:"sefard",lat:null,lng:null};
/* ספרדי = ערבית, אשכנזי = מעריב */
function shown(p){ return (p==="ערבית" && SITE.nusach==="ashkenaz") ? "מעריב" : p; }

function rpc(fn,args){
  return fetch(SUPA+"/rest/v1/rpc/"+fn,{method:"POST",cache:"no-store",
    headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"},
    body:JSON.stringify(args)}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); });
}
function esc(t){ return String(t==null?"":t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
/* 1.4: נכנסו דרך האפליקציה עם שם משתמש — רשימת בתי הכנסת של הלקוח */
var APP=qp.get("app")==="1", BACK=qp.get("back")==="1", SITES=[];
try{ SITES=JSON.parse(localStorage.getItem("nsf_gabbai_sites")||"[]")||[]; }catch(e){ SITES=[]; }
var GMODE=false; try{ GMODE=localStorage.getItem("nsf_gabbai_mode")==="1"; }catch(e){}
function head(sub){
  var btn = BACK ? '<button class="out" id="outb">חזרה לממשק</button>'
          : ((APP||GMODE) ? '<button class="out" id="outb">יציאה</button>' : '');
  return '<div class="top"><img src="'+document.querySelector("link[rel=icon]").href+'" alt="">'+
    '<div class="t">שלט גבאי<small>'+esc(sub||"")+'</small></div>'+btn+'</div>'+
    (SITES.length>1 ? '<div class="sites" id="sites">'+SITES.map(function(x){
      return '<button data-k="'+esc(x.key)+'" class="'+(x.key===CODE?'on':'')+'">'+esc(x.name)+'</button>'; }).join("")+'</div>' : '');
}
function wireHead(){
  var o=document.getElementById("outb");
  if(o) o.onclick=function(){
    if(BACK){ location.href="tenant_panel.html"; return; }
    if(!confirm("לצאת מהשלט?\nבכניסה הבאה יידרשו שם משתמש וסיסמה.")) return;
    try{
      ["nsf_gabbai_k","nsf_gabbai_sites","nsf_gabbai_mode","nsf_gabbai_user","nsf_gabbai_live"].forEach(function(k){ localStorage.removeItem(k); });
      var t=sessionStorage.getItem("nati_token");
      if(t) rpc("nsf_logout",{p_token:t}).catch(function(){});
      sessionStorage.clear();
    }catch(e){}
    location.replace("tenant_panel.html?_="+Date.now());
  };
  var st=document.getElementById("sites");
  if(st) st.onclick=function(e){
    var b=e.target.closest("button"); if(!b) return;
    CODE=b.getAttribute("data-k"); try{ localStorage.setItem("nsf_gabbai_k",CODE); }catch(x){}
    load();
  };
}
function askCode(err){
  app.innerHTML=head("נתי SAFE")+
    '<div class="big">'+(err?'<b style="color:#f85149">'+esc(err)+'</b><br>':'')+
    'פתחו את הקישור שקיבלתם מנתי SAFE,<br>או הקלידו את קוד בית הכנסת:</div>'+
    '<input id="kin" placeholder="קוד" autocomplete="off"><button class="go" id="kgo">כניסה</button>';
  wireHead();
  document.getElementById("kgo").onclick=function(){
    CODE=(document.getElementById("kin").value||"").trim();
    try{ localStorage.setItem("nsf_gabbai_k",CODE); }catch(e){}
    load();
  };
}
function autoName(){ return nsfPrayerNow(new Date(), SITE.lat!=null?+SITE.lat:null, SITE.lng!=null?+SITE.lng:null); }
function render(site, rooms){
  var opts=[["auto","אוטומטי"],["שחרית","שחרית"],["מנחה","מנחה"],["ערבית",shown("ערבית")],["מוסף","מוסף"]];
  app.innerHTML=head(site)+
    '<div class="pr" id="pr">'+opts.map(function(o){
      return '<button data-v="'+o[0]+'" class="'+(PRAYER===o[0]?'on':'')+'">'+o[1]+'</button>'; }).join("")+'</div>'+
    '<div class="hint" id="hint"></div>'+
    '<div class="grid'+(rooms.length===1?' one':'')+'" id="grid">'+rooms.map(function(r){
      return '<div class="cell" data-cell="'+r.id+'"><button class="rb" data-id="'+r.id+'"><span class="n">'+r.no+'</span>'+
        '<span class="nm">'+esc(r.name)+'</span><span class="st"></span></button>'+
        '<button class="cx" data-cx="'+r.id+'" data-nm="'+esc(r.name)+'">✕ ביטול ההודעה</button></div>'; }).join("")+'</div>'+
    '<div class="msg">לחיצה על חדר מקפיצה על המסך שמעל הדלת שלו<br>"תפילת … תתחיל כאן בעוד 3 דקות" עם ספירה לאחור,<br>ואז "מתחילה כאן עכשיו". במסך הראשי — באיזה שטיבל.<br>לחיצה נוספת לא משנה כלום. לביטול — הכפתור האדום.</div>';
  wireHead();
  /* חדרים שההודעה שלהם רצה עכשיו (נשמר בטלפון) */
  var LIVE={}; try{ LIVE=JSON.parse(localStorage.getItem("nsf_gabbai_live")||"{}")||{}; }catch(x){}
  function saveLive(){ try{ localStorage.setItem("nsf_gabbai_live",JSON.stringify(LIVE)); }catch(x){} }
  function paintLive(){
    var now=Date.now();
    [].forEach.call(document.querySelectorAll(".cell"),function(c){
      var id=c.getAttribute("data-cell"), on=LIVE[id] && LIVE[id].until>now;
      if(!on && LIVE[id]){ delete LIVE[id]; saveLive(); }
      c.classList.toggle("live",!!on);
      var st=c.querySelector(".rb .st");
      if(on){ var left=Math.max(0,Math.ceil((LIVE[id].until-now)/60000)); st.textContent="✓ מוצג · "+shown(LIVE[id].pr)+" · עוד כ-"+left+" דק'"; }
      else if(!c.querySelector(".rb").disabled && !c.querySelector(".rb").classList.contains("err")) st.textContent="";
    });
  }
  paintLive(); setInterval(paintLive,5000);
  document.getElementById("grid").addEventListener("click",function(e){
    var x=e.target.closest(".cx"); if(!x) return;
    e.stopPropagation();
    var id=x.getAttribute("data-cx");
    if(!confirm("לבטל את ההודעה ב"+x.getAttribute("data-nm")+"?\nהיא תיעלם מהמסכים מיד.")) return;
    x.disabled=true; x.textContent="מבטל…";
    rpc("nsf_room_call",{p_key:CODE,p_room:id,p_prayer:"ביטול"}).then(function(r){
      if(!r||!r.ok) throw new Error("x");
      delete LIVE[id]; saveLive(); paintLive();
      try{ navigator.vibrate&&navigator.vibrate(120); }catch(y){}
    }).catch(function(){ alert("הביטול לא נשלח — בדקו חיבור ונסו שוב"); })
      .then(function(){ x.disabled=false; x.textContent="✕ ביטול ההודעה"; });
  },true);
  function hint(){
    document.getElementById("hint").textContent = PRAYER==="auto"
      ? "יוצג עכשיו: תפילת "+shown(autoName())+" (לפי השעה)" : "יוצג: תפילת "+shown(PRAYER);
  }
  hint(); setInterval(hint,30000);
  document.getElementById("pr").onclick=function(e){
    var b=e.target.closest("button"); if(!b) return;
    PRAYER=b.getAttribute("data-v");
    [].forEach.call(this.children,function(x){ x.classList.toggle("on",x===b); });
    hint();
  };
  document.getElementById("grid").onclick=function(e){
    var b=e.target.closest(".rb"); if(!b || b.disabled) return;
    var pr=PRAYER==="auto"?autoName():PRAYER;
    var rid=b.getAttribute("data-id");
    /* כבר מוצג — לחיצה נוספת לא שולחת שוב */
    if(LIVE[rid] && LIVE[rid].until>Date.now()){ try{ navigator.vibrate&&navigator.vibrate(30); }catch(x){} return; }
    var st=b.querySelector(".st");
    b.disabled=true; b.classList.remove("err"); st.textContent="שולח…";
    try{ navigator.vibrate&&navigator.vibrate(40); }catch(x){}
    rpc("nsf_room_call",{p_key:CODE,p_room:b.getAttribute("data-id"),p_prayer:pr}).then(function(r){
      if(!r||!r.ok) throw new Error((r&&r.err)||"שגיאה");
      try{ navigator.vibrate&&navigator.vibrate([60,60,60]); }catch(x){}
      /* 3 דק' ספירה + עד 5 דק' "מתחילה עכשיו" (לפי הגדרת בית הכנסת) */
      LIVE[rid]={until:Date.now()+((+SITE.call_seconds||180)+180)*1000, pr:pr}; saveLive();
      b.disabled=false; paintLive();
    }).catch(function(err){
      b.classList.add("err"); st.textContent="לא נשלח — נסו שוב"; b.disabled=false;
    });
  };
}
function load(){
  if(!CODE){ askCode(); return; }
  app.innerHTML=head("טוען…"); wireHead();
  rpc("nsf_room_site",{p_key:CODE}).then(function(d){
    if(!d||!d.ok){ askCode("קוד לא מוכר"); return; }
    if(!d.rooms||!d.rooms.length){ app.innerHTML=head(d.site)+'<div class="big">אין עדיין חדרי תפילה עם מסך דלת<br>בבית הכנסת הזה.</div>'; wireHead(); return; }
    SITE={nusach:d.nusach||"sefard",lat:d.lat,lng:d.lng,call_seconds:d.call_seconds};
    render(d.site, d.rooms);
  }).catch(function(){ app.innerHTML=head("")+'<div class="big">אין חיבור לרשת. נסו שוב.</div>'; wireHead(); setTimeout(load,5000); });
}
load();
</script>
<div style="position:fixed;left:8px;bottom:6px;font-size:10px;color:#8b949e;opacity:.6;pointer-events:none">גרסה 1.4 · 23.10.26</div>
</body>
