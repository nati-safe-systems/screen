<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>נתי SAFE — ניהול אתר</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Assistant,Arial,sans-serif;background:#0d1117;color:#e6edf3;padding:12px;direction:rtl;font-size:14px}
h1{font-size:19px;color:#ffcc00;margin-bottom:2px}
.sub{font-size:12px;color:#8b949e;margin-bottom:14px}
.card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:13px;margin-bottom:12px}
.drw>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px}
.drw>summary::-webkit-details-marker{display:none}
.drw>summary::after{content:"\25BC";color:#8b949e;font-size:11px;margin-right:auto}
.drw[open]>summary::after{content:"\25B2"}
.drw>summary h2{flex:1}
.card h2{font-size:15px;color:#ffcc00;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center}
label{display:block;font-size:12px;color:#8b949e;margin:8px 0 3px}
input,select{width:100%;background:#0d1117;border:1px solid #30363d;color:#e6edf3;border-radius:6px;
  padding:7px 9px;font:inherit;font-size:14px;direction:rtl}
input[type=time],input[type=number],input[type=date]{direction:ltr;text-align:right}
button{background:#21262d;border:1px solid #30363d;color:#e6edf3;border-radius:6px;padding:7px 13px;
  font:inherit;font-size:13px;cursor:pointer}
button.pri{background:#ffcc00;color:#161b22;font-weight:800;border-color:#ffcc00}
button.dz{background:none;border:none;color:#8b949e;padding:2px 6px;font-size:16px}
button.dz:hover{color:#ff6b6b}
.row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.row>div{flex:1;min-width:110px}
.item{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:9px;margin-bottom:8px}
.item .hd{display:flex;justify-content:space-between;align-items:center;gap:6px}
.item .hd b{color:#ffcc00;font-size:14px}
.tag{display:inline-block;background:#21262d;color:#8b949e;font-size:11px;padding:1px 7px;border-radius:9px;margin-right:5px}
.times{margin-top:6px;font-size:13px;color:#7ee787;font-family:ui-monospace,monospace;direction:ltr;text-align:right;line-height:1.7}
.msg{padding:8px 11px;border-radius:7px;font-size:13px;margin-bottom:10px;display:none}
.ok{background:#0f2f1a;border:1px solid #2ea043;color:#7ee787}
.err{background:#3a1418;border:1px solid #b62324;color:#ff9a9a;word-break:break-word;line-height:1.5}
.hint{font-size:11.5px;color:#6e7681;margin-top:4px;line-height:1.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:620px){.grid{grid-template-columns:1fr}}
.hide{display:none}
.grp2{border:1px solid #30363d;border-radius:9px;margin-bottom:8px;overflow:hidden}
.grphd{display:flex;align-items:center;gap:8px;padding:9px 11px;cursor:pointer;background:#0d1117}
.grphd:hover{background:#131a24}
.grphd b{flex:1;font-size:14px}
.grphd .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.grphd .cnt{background:#21262d;color:#8b949e;font-size:11px;padding:1px 8px;border-radius:9px}
.grphd .arw{color:#8b949e;font-size:11px}
.grpbd{padding:9px 9px 4px;border-top:1px solid #21262d}
#saved{position:fixed;bottom:16px;left:16px;z-index:99;background:#0f2f1a;border:1px solid #2ea043;
  color:#7ee787;border-radius:20px;padding:6px 15px;font-size:13px;font-weight:700;
  opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}
#saved.on{opacity:1;transform:translateY(0)}
.autos{font-size:11.5px;color:#3fb950;background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.3);
  border-radius:6px;padding:6px 10px;margin-bottom:12px;line-height:1.5}
</style></head><body>

<h1>ניהול אתר</h1>
<div class="sub">נתי SAFE · לוח אחד לכל הבניין. מה שנשמר כאן מופיע בכל המסכים.</div>
<div class="autos">אין כפתור שמירה — כל שדה נשמר לבד ברגע שאתה יוצא ממנו. אישור ירוק יופיע בפינה.</div>
<div id="msg" class="msg"></div>
<div id="saved">נשמר ✓</div>
<datalist id="catlist"><option value="פרנס היום"><option value="פרנס הקפה"><option value="פרנס הכיבוד"><option value="נר למאור"><option value="פרנס המתמידים"><option value="תורם"><option value="הקדשה"></datalist>

<div class="card">
  <h2>אתר</h2>
  <select id="siteSel" onchange="pickSite()"></select>
  <div class="row" style="margin-top:9px">
    <div><label>שם אתר חדש</label><input id="newSite" placeholder="בית מדרש היכל יעקב"></div>
    <div style="flex:0"><button onclick="addSite()">הוסף</button></div>
  </div>
  <div id="siteCfg" class="hide">
    <label>שם האתר</label>
    <input id="s_name" onchange="saveSiteName()">
    <div class="grid" style="margin-top:9px">
      <div><label>קו רוחב</label><input id="s_lat" type="number" step="0.0001"></div>
      <div><label>קו אורך</label><input id="s_lng" type="number" step="0.0001"></div>
      <div><label>גובה (מ')</label><input id="s_elev" type="number"></div>
      <div><label>הדלקת נרות (דק' לפני שקיעה)</label><input id="s_candle" type="number"></div>
    </div>
    <button class="pri" style="margin-top:9px" onclick="saveSite()">שמור אתר</button>
    <div class="hint">הזמנים בכל מסכי האתר מחושבים לפי הנתונים האלה.</div>
  </div>
</div>

<details class="card drw" id="roomsCard">
  <summary><h2 style="margin:0">חדרים <button onclick="addRoom()">+ חדר</button></h2></summary>
  <div id="rooms"></div>
</details>

<details class="card drw" id="minCard">
  <summary><h2 style="margin:0">לוח מניינים <button onclick="addMin()">+ מניין</button></h2></summary>
  <div id="mins"></div>
</details>

<details class="card drw" id="sponCard">
  <summary><h2 style="margin:0">פרנסים ותורמים <button onclick="addSpon()">+ פרנס</button></h2></summary>
  <div id="spons"></div>
</details>

<details class="card drw">
  <summary><h2 style="margin:0">תצוגה מקדימה — היום</h2></summary>
  <div id="prev" style="font-size:13px;line-height:1.9"></div>
</details>

<script>/* =====================================================================
   נתי SAFE — מנוע זמנים הלכתיים
   zmanim-engine.js  ·  v1.0
   ---------------------------------------------------------------------
   מנוע עצמאי לחלוטין. אפס תלויות, אפס קריאות רשת, אפס API.
   מחושב לפי אלגוריתם NOAA Solar Position (דיוק שניות).

   מכויל מול הלוח הספירלי (אופק בית שמש), אלול תשפ"ו / אוגוסט-ספטמבר 2026.
   תוצאת הכיול: 14/14 התאמה מדויקת בשקיעה, צאת הכוכבים, חצות,
   מנחה גדולה, הדלקת נרות ורבנו תם.

   השיטות שזוהו בלוח (מוקשחות כאן):
     שקיעה / הנץ מוצג  : זווית 90.8333° + תיקון גובה תצפית
     חצות              : מעבר שמש אסטרונומי (לא אמצע היום)
     שעות זמניות       : נץ→שקיעה במישור (גובה 0), לא בגובה
     סוף זמן ק"ש מ"א   : 19.8° (עלות ותצאת 19.8°)
     סוף זמן ק"ש מ"א 72: 16.1°
     צאת הכוכבים       : 8.5° במישור
     רבנו תם           : שקיעה (בגובה) + 72 דקות
     הדלקת נרות        : שקיעה (בגובה) − 40 דקות
   כל הזמנים נחתכים כלפי מטה לדקה שלמה (floor), כמו בלוח.
   ===================================================================== */

(function (root) {
  'use strict';

  var RAD = Math.PI / 180, DEG = 180 / Math.PI;
  var EARTH_R = 6356900;           // מ' — ערך KosherJava
  var Z_SUNSET = 90 + 50 / 60;     // 90.833333° — שקיעה/נץ עם רפרקציה

  /* ---------- אסטרונומיה ---------- */

  function julianDay(y, m, d) {
    if (m <= 2) { y -= 1; m += 12; }
    var A = Math.floor(y / 100), B = 2 - A + Math.floor(A / 4);
    return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5;
  }
  function jc(jd) { return (jd - 2451545.0) / 36525.0; }

  function meanLong(t) { var L = 280.46646 + t * (36000.76983 + t * 0.0003032); return ((L % 360) + 360) % 360; }
  function meanAnom(t) { return 357.52911 + t * (35999.05029 - 0.0001537 * t); }
  function eccent(t) { return 0.016708634 - t * (0.000042037 + 0.0000001267 * t); }
  function eqCenter(t) {
    var m = meanAnom(t) * RAD;
    return Math.sin(m) * (1.914602 - t * (0.004817 + 0.000014 * t))
         + Math.sin(2 * m) * (0.019993 - 0.000101 * t)
         + Math.sin(3 * m) * 0.000289;
  }
  function appLong(t) {
    var o = meanLong(t) + eqCenter(t), om = 125.04 - 1934.136 * t;
    return o - 0.00569 - 0.00478 * Math.sin(om * RAD);
  }
  function oblCorr(t) {
    var s = 21.448 - t * (46.8150 + t * (0.00059 - t * 0.001813));
    return (23.0 + (26.0 + s / 60.0) / 60.0) + 0.00256 * Math.cos((125.04 - 1934.136 * t) * RAD);
  }
  function declination(t) {
    var e = oblCorr(t) * RAD, l = appLong(t) * RAD;
    return Math.asin(Math.sin(e) * Math.sin(l)) * DEG;
  }
  function eqTime(t) {
    var eps = oblCorr(t) * RAD, l0 = meanLong(t) * RAD, e = eccent(t), m = meanAnom(t) * RAD;
    var y = Math.tan(eps / 2); y *= y;
    return (y * Math.sin(2 * l0) - 2 * e * Math.sin(m) + 4 * e * y * Math.sin(m) * Math.cos(2 * l0)
      - 0.5 * y * y * Math.sin(4 * l0) - 1.25 * e * e * Math.sin(2 * m)) * DEG * 4.0;
  }

  /** תוספת מעלות מתחת לאופק בגלל גובה התצפית */
  function elevAdj(metres) {
    if (!metres || metres <= 0) return 0;
    return Math.acos(EARTH_R / (EARTH_R + metres)) * DEG;
  }

  function hourAngle(lat, decl, zenith) {
    var la = lat * RAD, de = decl * RAD, z = zenith * RAD;
    var c = (Math.cos(z) / (Math.cos(la) * Math.cos(de))) - Math.tan(la) * Math.tan(de);
    if (c < -1 || c > 1) return null;
    return Math.acos(c) * DEG;
  }

  /** אירוע שמש → דקות מחצות הלילה בשעון המקומי */
  function solarEvent(y, m, d, lat, lng, tzMin, zenith, isRise) {
    var jd = julianDay(y, m, d), t = jc(jd);
    var ha = hourAngle(lat, declination(t), zenith);
    if (ha === null) return null;
    var utc = 720 + 4 * (-lng - (isRise ? ha : -ha)) - eqTime(t);
    t = jc(jd + utc / 1440);
    ha = hourAngle(lat, declination(t), zenith);
    if (ha === null) return null;
    utc = 720 + 4 * (-lng - (isRise ? ha : -ha)) - eqTime(t);
    return utc + tzMin;
  }

  /** חצות אסטרונומי (מעבר שמש) */
  function solarNoon(y, m, d, lng, tzMin) {
    var jd = julianDay(y, m, d);
    var t = jc(jd + 0.5 + lng / 360);
    var n = 720 - 4 * lng - eqTime(t);
    t = jc(jd + n / 1440);
    n = 720 - 4 * lng - eqTime(t);
    return n + tzMin;
  }

  /* ---------- אזור זמן ---------- */

  /** היסט אמיתי בדקות מ-UTC לתאריך נתון, כולל שעון קיץ */
  function tzOffsetMinutes(date, timeZone) {
    try {
      var dtf = new Intl.DateTimeFormat('en-US', {
        timeZone: timeZone, hour12: false,
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
      var p = {}, parts = dtf.formatToParts(date);
      for (var i = 0; i < parts.length; i++) p[parts[i].type] = parts[i].value;
      var asUTC = Date.UTC(+p.year, p.month - 1, +p.day,
        p.hour === '24' ? 0 : +p.hour, +p.minute, +p.second);
      return Math.round((asUTC - Math.floor(date.getTime() / 1000) * 1000) / 60000);
    } catch (e) {
      return -date.getTimezoneOffset();
    }
  }

  /* ---------- פורמט ---------- */

  var QSEC = 15;
  /** עיגול ל-QSEC שניות ואז חיתוך לדקה — בדיוק כמו בלוח */
  function quant(m, q) {
    if (m === null || isNaN(m)) return m;
    q = (q === undefined) ? QSEC : q;
    if (!q) return m;
    return Math.round(m * 60 / q) * q / 60;
  }

  function fmt(mins, opt) {
    if (mins === null || isNaN(mins)) return '--:--';
    opt = opt || {};
    var total = opt.seconds ? Math.round(mins * 60) : Math.floor(mins) * 60;
    var h = Math.floor(total / 3600) % 24, r = total - Math.floor(total / 3600) * 3600;
    var mi = Math.floor(r / 60), se = r - mi * 60;
    var hh = opt.hour12 ? (h % 12 === 0 ? 12 : h % 12) : h;
    var s = (opt.pad === false ? hh : String(hh).padStart(2, '0')) + ':' + String(mi).padStart(2, '0');
    if (opt.seconds) s += ':' + String(se).padStart(2, '0');
    return s;
  }

  /* ---------- ברירות מחדל למיקומים ---------- */

  var PLACES = {
    jerusalem:  { name: 'ירושלים',   lat: 31.7683, lng: 35.2137, elevation: 754 },
    betshemesh: { name: 'בית שמש',   lat: 31.7500, lng: 34.9750, elevation: 214 }, // נקודת הייחוס של הלוח
    bneibrak:   { name: 'בני ברק',   lat: 32.0840, lng: 34.8330, elevation: 30  },
    telaviv:    { name: 'תל אביב',   lat: 32.0853, lng: 34.7818, elevation: 20  },
    haifa:      { name: 'חיפה',      lat: 32.7940, lng: 34.9896, elevation: 200 },
    beitar:     { name: 'ביתר עילית', lat: 31.6960, lng: 35.1180, elevation: 700 },
    modiin:     { name: 'מודיעין עילית', lat: 31.9310, lng: 35.0420, elevation: 320 },
    ashdod:     { name: 'אשדוד',     lat: 31.8040, lng: 34.6550, elevation: 30  },
    elad:       { name: 'אלעד',      lat: 32.0520, lng: 34.9520, elevation: 120 },
    safed:      { name: 'צפת',       lat: 32.9646, lng: 35.4960, elevation: 850 }
  };

  /* ---------- הגדרות שיטה (ניתנות לשינוי מהאדמין) ---------- */

  var DEFAULTS = {
    lat: 31.7683, lng: 35.2137, elevation: 754,
    timeZone: 'Asia/Jerusalem',
    candleMinutes: 40,        // הדלקת נרות לפני השקיעה
    tzeitDegrees: 8.5,        // צאת הכוכבים
    rtMinutes: 72,            // רבנו תם — דקות שוות אחרי השקיעה בגובה
    mgaDegrees: 19.8,         // מ"א ראשי
    mga72Degrees: 16.1,       // מ"א 72
    misheyakirDegrees: 11.5,  // משיכיר (לא אומת מול הלוח — ראה README)
    useElevationForShaot: false, // הלוח מחשב שעות זמניות במישור
    graHalfDay: false,        // ק"ש/תפילה גר"א לפי יום מלא (כפי שבלוח)
    quantizeSeconds: 15       // הלוח מעגל ל-15 שניות לפני החיתוך לדקה
  };

  /* ---------- החישוב הראשי ---------- */

  function getZmanim(date, cfg) {
    date = date || new Date();
    var c = {};
    for (var k in DEFAULTS) c[k] = DEFAULTS[k];
    if (cfg) for (var k2 in cfg) if (cfg[k2] !== undefined && cfg[k2] !== null) c[k2] = cfg[k2];

    var tzMin = tzOffsetMinutes(date, c.timeZone);

    // התאריך האזרחי המקומי (לא UTC) — קריטי, אחרת קופצים יום
    var loc = new Date(date.getTime() + tzMin * 60000);
    var Y = loc.getUTCFullYear(), M = loc.getUTCMonth() + 1, Dd = loc.getUTCDate();

    var zEl = Z_SUNSET + elevAdj(c.elevation);   // עם גובה
    var zMi = Z_SUNSET;                          // מישור

    function ev(zen, rise) { return solarEvent(Y, M, Dd, c.lat, c.lng, tzMin, zen, rise); }
    function deg(x, rise) { return ev(90 + x, rise); }

    var netzMishor = ev(zMi, true);
    var shkiaMishor = ev(zMi, false);
    var netzElev = ev(zEl, true);
    var shkiaElev = ev(zEl, false);
    var chatzot = solarNoon(Y, M, Dd, c.lng, tzMin);

    // שעה זמנית — לפי המישור (כפי שהלוח מחשב)
    var rS = c.useElevationForShaot ? netzElev : netzMishor;
    var sS = c.useElevationForShaot ? shkiaElev : shkiaMishor;
    var shaa = (sS - rS) / 12;
    // שעה זמנית לחצי-היום הבוקר (מהנץ עד חצות אסטרונומי)
    var shaaAM = (chatzot - rS) / 6;
    var shaaKS = c.graHalfDay ? shaaAM : shaa;

    // מ"א
    var alotMGA = deg(c.mgaDegrees, true), tzeitMGA = deg(c.mgaDegrees, false);
    var shaaMGA = (tzeitMGA - alotMGA) / 12;
    var alot72 = deg(c.mga72Degrees, true), tzeit72 = deg(c.mga72Degrees, false);
    var shaa72 = (tzeit72 - alot72) / 12;

    var out = {
      _meta: { date: Y + '-' + pad(M) + '-' + pad(Dd), tzOffsetMinutes: tzMin, config: c },

      alotHashachar:      alotMGA,                      // עלות השחר 19.8°
      alot72:             alot72,                       // עלות 16.1° (="72")
      misheyakir:         deg(c.misheyakirDegrees, true),
      netzMishor:         netzMishor,                   // הנץ מישורי
      netz:               netzElev,                     // הנץ בגובה התצפית
      sofZmanShmaMGA:     alotMGA + 3 * shaaMGA,
      sofZmanShmaMGA72:   alot72 + 3 * shaa72,
      sofZmanShmaGRA:     rS + 3 * shaaKS,
      sofZmanTfilaMGA:    alotMGA + 4 * shaaMGA,
      sofZmanTfilaGRA:    rS + 4 * shaaKS,
      chatzot:            chatzot,                      // מעבר שמש אסטרונומי
      minchaGedola:       rS + 6.5 * shaa,
      minchaKetana:       rS + 9.5 * shaa,
      plagHamincha:       rS + 10.75 * shaa,
      candleLighting:     shkiaElev - c.candleMinutes,
      shkia:              shkiaElev,                    // השקיעה המוצגת
      shkiaMishor:        shkiaMishor,
      tzeitHakochavim:    deg(c.tzeitDegrees, false),   // 8.5° במישור
      tzeitRT:            shkiaElev + c.rtMinutes,      // ר"ת דקות שוות
      tzeitRTDegrees:     deg(c.mga72Degrees, false),   // ר"ת מעלות
      chatzotLayla:       chatzot + 720,
      shaaZmanitGRA:      shaa,
      shaaZmanitMGA:      shaaMGA
    };
    // הלוח מדפיס את השקיעה/הנץ בדיוק 15 שניות; שאר הזמנים נחתכים מהערך הגולמי
    if (c.quantizeSeconds) {
      var qk = ['shkia', 'shkiaMishor', 'netz', 'netzMishor', 'candleLighting', 'tzeitRT'];
      for (var qi = 0; qi < qk.length; qi++) out[qk[qi]] = quant(out[qk[qi]], c.quantizeSeconds);
    }
    return out;
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  /** גרסה מפורמטת מוכנה לתצוגה */
  function getZmanimFormatted(date, cfg, opt) {
    var z = getZmanim(date, cfg), o = { _meta: z._meta };
    for (var k in z) {
      if (k.charAt(0) === '_' || k.indexOf('shaaZmanit') === 0) continue;
      o[k] = fmt(z[k], opt);
    }
    return o;
  }

  var API = {
    getZmanim: getZmanim,
    getZmanimFormatted: getZmanimFormatted,
    fmt: fmt,
    quant: quant,

    if(m.mode==="interval") h+='<div class="hint">לדוגמה: כל 15 דק\', משקיעה −90 עד שקיעה −20. מתעדכן לבד כל יום בשנה.</div>';
    if(m.active===false) h+='<div class="hint" style="color:#ff9f43">בחר תפילה כדי להפעיל את המניין ולשייך אותו למגירה.</div>';
    return h+'</div>';}).join("");}

/* ---------- פרנסים ---------- */
function today(){var t=new Date();return t.getFullYear()+"-"+pad2(t.getMonth()+1)+"-"+pad2(t.getDate());}
function pad2(n){return (n<10?"0":"")+n;}

function addSpon(){ if(!SITE)return say("בחר אתר",1);
  sf("sponsors",{method:"POST",body:JSON.stringify({site_id:SITE.id,category:"פרנס היום",
    name:"",priority:3,date_from:today(),date_to:today()})}).then(function(){pickSite();})
   .catch(function(e){say("שמירה נכשלה: "+(e.message||e),1);});}

function saveSpon(i,f,v){var x=SPONS[i];x[f]=(v===""?null:v);
  sf("sponsors?id=eq."+x.id,{method:"PATCH",body:JSON.stringify(mkObj(f,x[f]))})
   .then(function(){flash();drawSpons();})
   .catch(function(e){say("השמירה נכשלה: "+(e.message||e),1);});}

function delSpon(i){if(!confirm("למחוק?"))return;
  sf("sponsors?id=eq."+SPONS[i].id,{method:"DELETE"}).then(function(){say("נמחק");pickSite();});}

function drawSpons(){
  var t=today();
  document.getElementById("spons").innerHTML=SPONS.map(function(x,i){
    var live=(!x.date_from||t>=x.date_from)&&(!x.date_to||t<=x.date_to)&&x.active!==false;
    return '<div class="item" style="'+(live?"border-color:#2ea043":"")+'">'+
      '<div class="hd"><b>'+(esc(x.name)||"(ללא שם)")+'</b>'+
      '<span><span class="tag" style="'+(live?"color:#7ee787":"")+'">'+(live?"מוצג היום":"לא בתוקף")+'</span>'+
      '<button class="dz" onclick="delSpon('+i+')">×</button></span></div>'+
      '<div class="grid" style="margin-top:6px">'+
      '<div><label>סוג</label><input list="catlist" value="'+esc(x.category||"")+'" onchange="saveSpon('+i+',\'category\',this.value)"></div>'+
      '<div><label>שם</label><input value="'+esc(x.name||"")+'" placeholder="ר\' ישראל ישראלי" onchange="saveSpon('+i+',\'name\',this.value)"></div>'+
      '<div><label>הקדשה</label><input value="'+esc(x.dedication||"")+'" placeholder="לעילוי נשמת / לרפואת" onchange="saveSpon('+i+',\'dedication\',this.value)"></div>'+
      '<div><label>בולטות</label><select onchange="saveSpon('+i+',\'priority\',+this.value)">'+opts(PRIO,String(x.priority||3))+'</select></div>'+
      '<div><label>מתאריך</label><input type="date" value="'+(x.date_from||"")+'" onchange="saveSpon('+i+',\'date_from\',this.value)"></div>'+
      '<div><label>עד תאריך</label><input type="date" value="'+(x.date_to||"")+'" onchange="saveSpon('+i+',\'date_to\',this.value)"></div>'+
      '</div></div>';}).join("")||'<div class="hint">אין פרנסים. הוסף אחד — הוא יופיע במסך חדר הקפה ובמסך הפרנסים בטווח התאריכים שתגדיר.</div>';}

function opts(o,sel){return Object.keys(o).map(function(k){
  return "<option value='"+k+"'"+(sel===k?" selected":"")+">"+o[k]+"</option>";}).join("");}
function esc(t){return String(t==null?"":t).replace(/"/g,"&quot;").replace(/</g,"&lt;");}

function preview(){
  if(!SITE)return;
  var now=new Date();
  var z=NatiZmanim.getZmanim(now,{lat:+SITE.lat,lng:+SITE.lng,elevation:+SITE.elevation,
        candleMinutes:+SITE.candle_offset||40,timeZone:"Asia/Jerusalem"});
  var out='<div style="color:#8b949e;font-size:12px;margin-bottom:6px">שקיעה '+NatiMinyan.fmt(z.shkia)+
          '  ·  צאת הכוכבים '+NatiMinyan.fmt(z.tzeitHakochavim)+'</div>';
  var rooms=ROOMS.slice(); rooms.push({id:null,name:"ללא חדר"});
  rooms.forEach(function(r){
    var rows=MINS.filter(function(m){return m.room_id===r.id;});
    if(!rows.length)return;
    var list=NatiMinyan.resolve(rows,z,now,{});
    if(!list.length)return;
    var g=NatiMinyan.byPrayer(list);
    out+='<div style="margin-top:7px"><b style="color:#ffcc00">'+esc(r.display_name||r.name)+'</b>';
    for(var p in g) out+='<div><span style="color:#8b949e">'+(PRAYERS[p]||p)+':</span> '+
      '<span style="font-family:ui-monospace,monospace;color:#7ee787;direction:ltr">'+
      g[p].map(function(x){return x.time;}).join("  ")+'</span></div>';
    out+='</div>';});
  var nowMin=now.getHours()*60+now.getMinutes();
  var all=NatiMinyan.resolve(MINS,z,now,{}), nx=NatiMinyan.next(all,nowMin);
  out+='<div style="margin-top:9px;color:#ffd86b">המניין הבא: '+
       (nx?((PRAYERS[nx.prayer]||nx.prayer)+" "+nx.time+" — "+NatiMinyan.countdown(nx.minutes,nowMin)):"אין נוספים היום")+'</div>';
  document.getElementById("prev").innerHTML=out;}

boot(); setInterval(preview,30000);
</script></body></html>
