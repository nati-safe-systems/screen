<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>נתי SAFE — מקווה</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;800;900&family=Heebo:wght@300;400;500;700;800;900&family=Rubik:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700;1,900&family=Suez+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:Assistant,Arial,sans-serif;background:#05070e;color:#e6edf3;direction:rtl;
  display:flex;flex-direction:column}
.hdr{background:#7a0000;color:#fff;text-align:center;padding:.35vh 0;font-size:1.1vh;
  border-bottom:1px solid #ffcc00;flex-shrink:0}

/* ---------- שורה עליונה: שעון + זמנים ---------- */
.top{display:flex;align-items:stretch;gap:1.2vw;padding:1.4vh 1.6vw;flex-shrink:0;
  background:linear-gradient(180deg,#0d1526,#080d1a);border-bottom:2px solid rgba(255,204,0,.28)}
.clockbox{flex:0 0 auto;text-align:center;padding-left:1.6vw;border-left:1px solid rgba(255,255,255,.1)}
#clock{color:#ffd227;font-size:8vh;font-weight:800;line-height:1;letter-spacing:.02em;
  font-variant-numeric:tabular-nums;text-shadow:0 0 3.2vh rgba(255,204,0,.5),0 .3vh 1vh rgba(0,0,0,.6)}
#clock .sec{font-size:.45em;color:#c99a2e;font-weight:700;vertical-align:.55em;margin-right:.15em;letter-spacing:0}
#dheb{color:#ffd86b;font-size:2.1vh;font-weight:700;margin-top:.5vh}
#dgreg{color:#8fb4dd;font-size:1.5vh;margin-top:.2vh}

.zwrap{flex:1;display:flex;align-items:center;justify-content:flex-start;gap:1vw;flex-wrap:wrap;min-width:0}
.zc{background:rgba(255,255,255,.05);border:1px solid rgba(255,204,0,.28);border-radius:1.1vh;
  padding:.9vh 1.5vw;text-align:center;min-width:9vw}
.zc.past{opacity:.38}
.zc.hot{background:linear-gradient(180deg,rgba(160,25,25,.55),rgba(105,10,10,.6));
  border-color:#ffcc00;box-shadow:0 0 2.2vh rgba(255,204,0,.35)}
.zc small{display:block;color:#c8d8ea;font-size:1.5vh;font-weight:700;margin-bottom:.3vh}
.zc b{display:block;color:#00ff88;font-size:3.6vh;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.zc.hot b{color:#ffd86b}
.zc .cd{display:block;color:#ffb4b4;font-size:1.3vh;margin-top:.3vh}

/* ---------- מניינים ---------- */
.mid{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;display:flex;flex-direction:column;padding:1.4vh 1.6vw .8vh}
.mid>.secttl,.mid>.mgrid{position:relative;z-index:2}
.secttl{color:#ffcc00;font-size:1.7vh;font-weight:800;letter-spacing:.1vh;margin-bottom:.9vh;
  display:flex;align-items:center;gap:.8vw}
.secttl:after{content:"";flex:1;height:1px;background:rgba(255,204,0,.28)}
.mgrid{flex:1;min-height:0;display:grid;gap:1vw;align-content:stretch}
.mcard{background:linear-gradient(160deg,rgba(20,32,58,.95),rgba(10,16,30,.95));
  border:1px solid rgba(140,180,230,.22);border-radius:1.4vh;padding:1.2vh 1.2vw;
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:.4vh;
  min-height:0;overflow:hidden}
.mcard.soon{border-color:#ffcc00;background:linear-gradient(160deg,rgba(70,45,0,.9),rgba(30,18,0,.95));
  box-shadow:0 0 2.6vh rgba(255,204,0,.3)}
.mcard .rn{color:#fff;font-size:2.2vh;font-weight:800;font-family:"Frank Ruhl Libre",serif;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mcard .pr{color:#9fc0e4;font-size:1.4vh}
.mcard .tm{color:#00ff88;font-size:4vh;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.mcard.soon .tm{color:#ffd86b}
.mcard .cd{color:#ffcc00;font-size:1.9vh;font-weight:800}
.mrow{display:flex;justify-content:space-between;align-items:baseline;gap:1vw;
  width:100%;padding:.5vh 0;border-bottom:1px solid rgba(255,255,255,.08)}
.mrow:last-of-type{border-bottom:none}
.mp{color:#9fc0e4;font-size:1.8vh;font-weight:700}
.mt{color:#fff;font-size:2.1vh;font-variant-numeric:tabular-nums}
.mt b{color:#00ff88;font-weight:800;margin-right:.4vw}
.mt b.nx{color:#ffd86b;text-shadow:0 0 1.6vh rgba(255,204,0,.5)}
.mcard .none{color:#6e7f95;font-size:1.7vh}

/* ---------- פרנסים ---------- */
.spon{flex-shrink:0;padding:.8vh 1.6vw 1.2vh}
.sgrid{display:flex;flex-direction:column;gap:.7vh}
.srow{display:grid;gap:.9vw}
.sc{background:linear-gradient(160deg,rgba(58,40,0,.85),rgba(28,18,0,.9));
  border:1px solid rgba(255,204,0,.42);border-radius:1.3vh;padding:1vh 1vw;text-align:center;
  display:flex;flex-direction:column;justify-content:center;gap:.25vh;overflow:hidden}
.sc .cat{color:#ffcc00;font-size:1.4vh;font-weight:800;letter-spacing:.05vh}
.sc .nm{color:#fff;font-size:2.4vh;font-weight:800;font-family:"Frank Ruhl Libre",serif;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc .dd{color:#e8d6a8;font-size:1.4vh}
/* דרגה 1 — הגדולה ביותר. כל מי שבדרגה זו מקבל בדיוק אותו גודל. */
.srow.t1 .sc{border-color:#ffd86b;border-width:2px;box-shadow:0 0 2.8vh rgba(255,204,0,.4);
  background:linear-gradient(160deg,rgba(92,64,0,.92),rgba(45,28,0,.95));padding:1.4vh 1vw}
.srow.t1 .nm{font-size:3.4vh}
.srow.t1 .cat{font-size:1.7vh}
.srow.t1 .dd{font-size:1.6vh}
.srow.t2 .nm{font-size:2.8vh}
.srow.t4 .nm,.srow.t5 .nm{font-size:2vh}
.srow.t4 .sc,.srow.t5 .sc{padding:.7vh .8vw}

.ft{flex-shrink:0;border-top:1px solid rgba(255,255,255,.1);padding:.5vh;display:flex;
  align-items:center;justify-content:center;gap:.8vw;color:rgba(255,255,255,.45);font-size:1.1vh}
.fl{height:3vh;opacity:.85}
/* לוח ערב שבת — ריווח נדיב בין הזמנים */
.shzm{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;
  gap:1.2vh 4.5vw;margin:.6vh 0}
.shzm>div{text-align:center;min-width:8vw}
.shzm .pr{font-size:1.7vh;margin-bottom:.5vh;letter-spacing:.05vh}
.shzm .tm{font-size:4.4vh;color:#ffd86b}
.cdbig{font-size:2.6vh}
.cdbig .num{font-size:3.6vh;font-weight:900;font-variant-numeric:tabular-nums;
  color:#fff;text-shadow:0 0 2vh rgba(255,204,0,.5)}
#bgimg{position:absolute;inset:0;z-index:0;overflow:hidden}
.bgslide{position:absolute;inset:0;background-size:cover;background-position:center;
  opacity:0;transition:opacity 1.8s ease-in-out}
.bgslide.on{opacity:1}
#bgveil{position:absolute;inset:0;background:rgba(4,8,18,.74);z-index:1}
.hide{display:none!important}

/* מסך מאונך או צר — הפריסה מתארגנת מחדש */
@media (max-aspect-ratio: 1/1){
  .top{flex-direction:column;gap:1vh;padding:1.4vh 3vw}
  .clockbox{padding-left:0;border-left:none;border-bottom:1px solid rgba(255,255,255,.1);
    padding-bottom:1vh;width:100%}
  #clock{font-size:6vh}
  .zwrap{justify-content:center;gap:1.6vw}
  .zc{min-width:26vw;padding:.8vh 2vw}
  .zc small{font-size:1.3vh}
  .zc b{font-size:3vh}
  .mcard .rn{font-size:2vh}
  .mcard .tm{font-size:3.4vh}
  .sc .nm{font-size:2.1vh}
  .sc.p1 .nm{font-size:2.8vh}
}

/* ===== טיפוגרפיה — נתי SAFE ===== */
:root{
  --f-body:"Heebo","Assistant",Arial,sans-serif;
  --f-disp:"Frank Ruhl Libre","David Libre",serif;
  --f-num:"Rubik","Heebo",Arial,sans-serif;
  --gold:#ffd227; --gold-soft:#ffe9a8;
}
body{font-family:var(--f-body)!important;-webkit-font-smoothing:antialiased}
.num,#clock,.topbar .clk,.tm,.cd,.big,.at,.zr b,.prow i,.mt,.mt b{
  font-family:var(--f-num)!important;font-feature-settings:"tnum" 1;font-variant-numeric:tabular-nums}
/* השעון — מוטה קלות, נותן תחושת תנועה ויוקרה */
#clock,.topbar .clk{
  font-family:var(--f-num)!important;font-weight:800!important;
  transform:skewX(-6deg);display:inline-block;
  background:linear-gradient(180deg,#d9ffe9 0%,#00ff88 45%,#00a85c 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 .25vh .8vh rgba(0,0,0,.55)) drop-shadow(0 0 2.4vh rgba(0,255,136,.4))}
#clock .sec,.topbar .clk .sec,.topbar .clk .sec2{
  font-size:.4em!important;-webkit-text-fill-color:#5fbf90;background:none;filter:none;
  vertical-align:.62em;margin-right:.14em;font-weight:700}
/* כותרות — סריף כבד עם עומק */
.head h1,.ttl b,.bigttl,.mcard .rn,.room .rn,.sc .nm,.cdwrap .pray,.hdr{
  font-family:var(--f-disp)!important}
.head h1,.ttl b,.bigttl{
  background:linear-gradient(180deg,#fff3c9 0%,#ffcc00 55%,#c98f10 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 .3vh 1vh rgba(0,0,0,.65))}
.hdr{font-family:var(--f-body)!important;letter-spacing:.06em}
/* כרטיסים — עומק עדין */
.mcard,.room,.sc,.ann{box-shadow:0 .6vh 2.2vh rgba(0,0,0,.45),inset 0 .1vh 0 rgba(255,255,255,.06)}

</style></head><body>

<div class="hdr">בס"ד &nbsp;·&nbsp; <span id="siteName"></span></div>

<div class="top">
  <div class="clockbox">
    <div id="clock">--:--:--</div>
    <div id="dheb"></div>
    <div id="dgreg"></div>
  </div>
  <div class="zwrap" id="zwrap"></div>
</div>

<div class="mid">
  <div id="bgimg"></div><div id="bgveil"></div>
  <div class="secttl">זמני התפילות</div>
  <div class="mgrid" id="mgrid"></div>
</div>

<div class="ft"><span id="ftLogo"></span><span>© כל הזכויות שמורות ל-נתי Safe מערכות · <span dir="ltr">052-717-1280</span></span></div>

<script>
/* =====================================================================
   נתי SAFE — התראות פיקוד העורף  ·  v1.0
   ---------------------------------------------------------------------
   תצוגה משלימה בלבד. אין להסתמך על המסך כאמצעי התרעה.
   המסך מציג חיווי חיבור גלוי — אם הקשר נופל, רואים את זה.

   שני מסלולים:
     1. חיבור ישיר (WebSocket) — מיידי, כשהרשת מאפשרת
     2. דרך Supabase — גיבוי, עד דקה של השהיה

   שימוש:
     NatiAlerts.init({ supa:SUPA, key:SKEY, areas:["ירושלים","בית שמש"] });
   ===================================================================== */
(function (root) {
  'use strict';

  var CFG = { supa:'', key:'', areas:[], testMode:false };
  /* שני מסלולים עצמאיים. החיווי מציג את הטוב מביניהם — קודם הם דרסו זה את זה. */
  var state = { wsOk:false, apiOk:false, sbOk:false, rtOk:false, sbMsg:'', wsWhy:'',
                last:null, active:null, hideT:null };
  var ws = null, poll = null, audioCtx = null, sirenTimer = null;

  /* ---------- ממשק ---------- */
  function ensureDom(){
    if (document.getElementById('nsf-alert')) return;

    var css = document.createElement('style');
    css.textContent =
      /* חלון במרכז המסך, לא השתלטות על הכל — שאר התוכן נשאר גלוי מאחור */
      '#nsf-alert{position:fixed;inset:0;z-index:2147483000;display:none;' +
        'background:rgba(0,0,0,.62);backdrop-filter:blur(3px);' +
        'align-items:center;justify-content:center;direction:rtl;' +
        'font-family:Heebo,Assistant,Arial,sans-serif}' +
      '#nsf-alert .in{width:min(62%,900px);max-height:78%;overflow:hidden;text-align:center;' +
        'padding:4.5vh 3vw;border-radius:2.4vh;color:#fff;' +
        'background:radial-gradient(ellipse at 50% 30%,#c31414,#6d0000 65%,#3a0000);' +
        'border:.5vh solid #ff6b5a;' +
        'box-shadow:0 0 9vh rgba(255,60,40,.65),0 2vh 6vh rgba(0,0,0,.75);' +
        'animation:nsfPulse 1.1s ease-in-out infinite}' +
      '@keyframes nsfPulse{0%,100%{transform:scale(1);box-shadow:0 0 7vh rgba(255,60,40,.5),0 2vh 6vh rgba(0,0,0,.75)}' +
        '50%{transform:scale(1.025);box-shadow:0 0 13vh rgba(255,90,60,.85),0 2vh 6vh rgba(0,0,0,.75)}}' +
      '#nsf-alert .t{font-size:9vh;font-weight:900;line-height:1;letter-spacing:.02em;' +
        'font-family:"Frank Ruhl Libre",serif;text-shadow:0 0 5vh rgba(255,150,120,.8)}' +
      '#nsf-alert .s{font-size:3.6vh;font-weight:800;margin-top:1.6vh;color:#ffd9d2}' +
      '#nsf-alert .a{font-size:3vh;font-weight:800;margin-top:2vh;color:#fff;' +
        'background:rgba(0,0,0,.4);border:.25vh solid rgba(255,255,255,.45);' +
        'border-radius:1.2vh;padding:1.2vh 2vw;display:inline-block}' +
      '#nsf-alert .n{font-size:1.8vh;margin-top:2.4vh;color:rgba(255,255,255,.8);line-height:1.5}' +
      '#nsf-conn{position:fixed;bottom:6px;left:6px;z-index:2147482000;' +
        'font:700 11px Heebo,Assistant,Arial,sans-serif;direction:rtl;padding:2px 8px;' +
        'border-radius:9px;opacity:.85;pointer-events:none}' +
      '#nsf-conn.ok{background:rgba(20,60,35,.75);color:#7ee787;border:1px solid rgba(126,231,135,.4)}' +
      '#nsf-conn.no{background:rgba(70,20,20,.8);color:#ff9a9a;border:1px solid rgba(255,120,120,.5)}';
    document.head.appendChild(css);

    var d = document.createElement('div');
    d.id = 'nsf-alert';
    d.innerHTML = '<div class="in"><div class="t">צבע אדום</div>' +
      '<div class="s" id="nsf-alert-sub"></div>' +
      '<div class="a" id="nsf-alert-area"></div>' +
      '<div class="n">היכנסו למרחב המוגן · תצוגה משלימה בלבד, אין להסתמך עליה</div></div>';
    document.body.appendChild(d);

    var c = document.createElement('div');
    c.id = 'nsf-conn'; c.className = 'no'; c.textContent = 'פיקוד העורף: מתחבר...';
    document.body.appendChild(c);
  }

  function renderConn(){
    var c = document.getElementById('nsf-conn');
    if (!c) return;
    var ok = state.rtOk || state.wsOk || state.apiOk || state.sbOk;
    var txt = state.rtOk  ? 'מחובר · זמן אמת'
            : state.wsOk  ? 'מחובר (ישיר · חי)'
            : state.apiOk ? 'מחובר (ישיר)'
            : state.sbOk  ? 'מחובר (גיבוי)'
            : (state.sbMsg || 'אין קשר');
    c.className = ok ? 'ok' : 'no';
    c.textContent = 'פיקוד העורף: ' + txt;
  }

  /* ---------- צליל ----------
     מייצרים צפירה בקוד, בלי קובץ חיצוני, כדי שתעבוד גם בלי רשת. */
  function siren(on){
    if (!on){ if (sirenTimer){ clearInterval(sirenTimer); sirenTimer = null; } return; }
    if (sirenTimer) return;
    function beep(){
      try{
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        var t = audioCtx.currentTime;
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(480, t);
        o.frequency.linearRampToValueAtTime(900, t + 0.9);
        o.frequency.linearRampToValueAtTime(480, t + 1.8);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.35, t + 0.15);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t); o.stop(t + 1.9);
      }catch(e){}
    }
    beep();
    sirenTimer = setInterval(beep, 2000);
  }

  /* ---------- הצגה ---------- */
  function show(areas, title){
    ensureDom();
    var d = document.getElementById('nsf-alert');
    document.getElementById('nsf-alert-sub').textContent  = title || 'ירי רקטות וטילים';
    document.getElementById('nsf-alert-area').textContent = (areas || []).join(' · ');
    d.style.display = 'flex';
    siren(true);
    state.active = { areas: areas, at: Date.now() };
    /* ההתראה נעלמת לבד אחרי 3 דקות */
    clearTimeout(state.hideT);
    state.hideT = setTimeout(hide, 3 * 60 * 1000);
  }
  function hide(){
    var d = document.getElementById('nsf-alert');
    if (d) d.style.display = 'none';
    siren(false);
    state.active = null;
  }

  /* ---------- האם ההתראה נוגעת לנו ---------- */
  function relevant(areas){
    if (!CFG.areas.length) return true;              /* לא הוגדרו אזורים — מציגים הכל */
    if (!areas || !areas.length) return false;
    for (var i=0;i<areas.length;i++)
      for (var j=0;j<CFG.areas.length;j++)
        if (String(areas[i]).indexOf(CFG.areas[j]) > -1 ||
            CFG.areas[j].indexOf(String(areas[i])) > -1) return true;
    return false;
  }

  function handle(payload){
    if (!payload) return;
    var areas = payload.cities || payload.areas || [];
    var title = payload.title || payload.desc || 'ירי רקטות וטילים';
    var id = (payload.id || '') + '|' + areas.join(',');
    if (id === state.last) return;                   /* אותה התראה שוב */
    state.last = id;
    if (relevant(areas)) show(areas, title);
  }

  /* ---------- מסלול 1: חיבור ישיר ---------- */
  function connectWs(){
    try{
      ws = new WebSocket('wss://ws.tzevaadom.co.il:8443/socket?platform=WEB');
      ws.onopen = function(){ state.wsOk = true; renderConn(); };
      ws.onmessage = function(ev){
        try{
          var m = JSON.parse(ev.data);
          if (m && m.type === 'ALERT' && m.data) handle(m.data);
        }catch(e){}
      };
      ws.onclose = function(ev){
        state.wsOk = false;
        state.wsWhy = 'סגירה '+(ev&&ev.code||'?');
        renderConn(); ws=null;
        /* קוד 1006 חוזר = הרשת או השירות חוסמים. מפסיקים לנסות
           אחרי שלושה כשלונות, במקום להעמיס לנצח. */
        state.wsFails = (state.wsFails||0)+1;
        if (state.wsFails <= 3) setTimeout(connectWs, 30000);
        else state.wsWhy = 'חסום';
      };
      ws.onerror = function(){ try{ ws.close(); }catch(e){} };
    }catch(e){ state.wsOk=false; renderConn(); setTimeout(connectWs, 60000); }
  }

  /* ---------- מסלול 1ב: פנייה ישירה ב-HTTPS ----------
     ה-WebSocket רץ על פורט 8443 שהרבה רשתות חוסמות.
     כאן פונים על 443 הרגיל, שעובר כמעט תמיד. */
  function pollDirect(){
    fetch('https://www.tzevaadom.co.il/api/alerts-history?limit=1',
      { cache:'no-store' })
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(rows){
        state.apiOk = true; renderConn();
        if (!Array.isArray(rows) || !rows.length) return;
        var a = rows[0];
        var t = a.time ? a.time*1000 : (a.createdAt ? new Date(a.createdAt).getTime() : 0);
        if (t && Date.now() - t > 5*60*1000) return;
        handle({ id:a.id || String(t), cities:a.cities || a.areas || [], title:a.title });
      })
      .catch(function(){
        state.apiOk = false; renderConn();
        state.apiFails = (state.apiFails||0)+1;
        /* חסימת CORS אינה משתנה עם הזמן — אין טעם להמשיך לנסות */
        if (state.apiFails > 3 && window._apiT){ clearInterval(window._apiT); window._apiT=null; }
      });
  }

  /* ---------- מסלול ראשי: חיבור חי ל-Supabase ----------
     אותו דומיין שכבר עובד, ולכן עובר בכל רשת שבה המסך פועל.

                (now.getDay()===5 && nowMin>=Z.candleLighting);
  if(isShabbat){
    document.querySelector(".secttl").textContent="שבת קודש";
    var gs=document.getElementById("mgrid");
    gs.style.gridTemplateColumns="1fr";
    gs.innerHTML='<div class="mcard soon" style="gap:2vh;justify-content:center">'+
      '<div class="rn" style="font-size:5.4vh">שבת שלום ומבורך</div>'+
      '<div class="shzm">'+
        '<div><div class="pr">כניסת השבת</div><div class="tm">'+NatiMinyan.fmt(Z.candleLighting)+'</div></div>'+
        '<div><div class="pr">שקיעה</div><div class="tm">'+NatiMinyan.fmt(Z.shkia)+'</div></div>'+
        '<div><div class="pr">צאת השבת</div><div class="tm">'+NatiMinyan.fmt(Z.tzeitHakochavim)+'</div></div>'+
        '<div><div class="pr">רבינו תם</div><div class="tm">'+NatiMinyan.fmt(Z.tzeitRT)+'</div></div>'+
      '</div></div>';
    return;
  }

  var isErev=(now.getDay()===5);
  if(isErev){
    var anyNext=false;
    shuls.forEach(function(r){
      var rr=MINS.filter(function(m){return m.room_id===r.id||!m.room_id;});
      if(NatiMinyan.next(NatiMinyan.resolve(rr,Z,now,{}),nowMin)) anyNext=true;
    });
    if(!anyNext){
      document.querySelector(".secttl").textContent="ערב שבת קודש";
      var g0=document.getElementById("mgrid");
      g0.style.gridTemplateColumns="1fr";
      var cd=cdSec(Z.candleLighting,now);
      g0.innerHTML='<div class="mcard soon" style="gap:2vh;justify-content:center">'+
        '<div class="rn" style="font-size:4.6vh">שבת שלום ומבורך</div>'+
        '<div class="shzm">'+
          '<div><div class="pr">הדלקת נרות</div><div class="tm">'+NatiMinyan.fmt(Z.candleLighting)+'</div></div>'+
          '<div><div class="pr">שקיעה</div><div class="tm">'+NatiMinyan.fmt(Z.shkia)+'</div></div>'+
          '<div><div class="pr">צאת השבת</div><div class="tm">'+NatiMinyan.fmt(Z.tzeitHakochavim)+'</div></div>'+
          '<div><div class="pr">רבינו תם</div><div class="tm">'+NatiMinyan.fmt(Z.tzeitRT)+'</div></div>'+
        '</div>'+
        (cd ? '<div class="cd cdbig">בעוד <span class="num">'+cd.t+'</span> '+cd.u+' זמן הדלקת נרות</div>'
            : '')+
        '</div>';
      return;
    }
    document.querySelector(".secttl").textContent="המניין הבא";
  }
  var g=document.getElementById("mgrid"), n=shuls.length||1;
  var portrait=(window.innerHeight>window.innerWidth);
  var cols = portrait ? (n<=3?1:2) : (n<=2?n:(n<=4?2:3));
  g.style.gridTemplateColumns="repeat("+cols+",1fr)";
  g.innerHTML=shuls.map(function(r){
    /* מניין ללא חדר = "כל החדרים", ולכן חל גם כאן */
    var rows=MINS.filter(function(m){return m.room_id===r.id || !m.room_id;});
    var list=NatiMinyan.resolve(rows,Z,now,{});
    var nx=NatiMinyan.next(list,nowMin);
    var soon=nx && (nx.minutes-nowMin)<=20;
    var title=r.display_name||r.name;
    if(!list.length){
      var msg = rows.length===0 ? "לא הוגדרו מניינים לחדר זה" : "אין מניינים ביום זה";
      return '<div class="mcard"><div class="rn">'+esc(title)+'</div>'+
             '<div class="none">'+msg+'</div></div>';
    }
    /* במקווה מציגים את כל שעות התפילה, כדי שאדם ידע מתי הכל */
    var g=NatiMinyan.byPrayer(list), rowsHtml="";
    for(var pk in g){
      rowsHtml+='<div class="mrow"><span class="mp">'+(PR[pk]||pk)+'</span>'+
        '<span class="mt">'+g[pk].map(function(x){
          return '<b'+(nx&&x.minutes===nx.minutes?' class="nx"':'')+'>'+x.time+'</b>';
        }).join(" · ")+'</span></div>';
    }
    return '<div class="mcard'+(soon?" soon":"")+'" style="align-items:stretch">'+
      '<div class="rn">'+esc(title)+'</div>'+rowsHtml+
      (nx?'<div class="cd">הבא: '+(PR[nx.prayer]||nx.prayer)+' '+nx.time+' · '+
          (NatiMinyan.countdown(nx.minutes,nowMin)||"")+'</div>':'')+'</div>';

  }).join("")||'<div class="mcard"><div class="none">לא הוגדרו בתי כנסת באתר</div></div>';
}

function p2(n){return (n<10?"0":"")+n;}

/* ספירה לאחור חיה עם שניות */
function cdSec(targetMin, now){
  var nowSec = now.getHours()*3600 + now.getMinutes()*60 + now.getSeconds();
  var d = Math.round(targetMin*60) - nowSec;
  if(d<0) return null;
  var h=Math.floor(d/3600), m=Math.floor((d%3600)/60), sec=d%60;
  return h>0 ? {t:h+":"+p2(m)+":"+p2(sec), u:"שעות"}
             : {t:p2(m)+":"+p2(sec),        u:"דקות"};
}
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}

function tick(){
  var now=new Date();
  var _h=now.getHours(),_m=now.getMinutes(),_s=now.getSeconds();
  document.getElementById("clock").innerHTML=
    p2(_h)+":"+p2(_m)+'<span class="sec">'+p2(_s)+'</span>';
  document.getElementById("dheb").textContent=
    NatiHebDate.format(now,{weekday:true,shkiaMinutes:(Z?Z.shkia:null)});
  document.getElementById("dgreg").textContent=
    now.toLocaleDateString("he-IL",{day:"numeric",month:"long",year:"numeric"});
  if(!SITE)return;
  zmans(now);
  var nowMin=now.getHours()*60+now.getMinutes()+now.getSeconds()/60;
  drawZmanim(now,nowMin);
  drawMinyanim(now,nowMin);
}
setInterval(tick,1000);
setInterval(function(){ ZDAY=""; load(); }, 5*60*1000);   /* רענון נתונים כל 5 דקות */
load(); tick();
</script></body></html>
