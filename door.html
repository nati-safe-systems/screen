<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>נתי SAFE — מסך כניסה</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Frank+Ruhl+Libre:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:Assistant,Arial,sans-serif;background:#05070e;color:#e6edf3;direction:rtl;
  display:flex;flex-direction:column}

/* ---------- כותרת השטיבל ---------- */
.head{flex-shrink:0;text-align:center;padding:2.2vh 2vw 1.8vh;
  background:linear-gradient(135deg,rgba(62,0,0,.97),rgba(30,0,0,.98));
  border-bottom:.35vh solid #ffcc00;box-shadow:0 .6vh 3vh rgba(0,0,0,.7)}
.head .pre{color:rgba(255,204,0,.55);font-size:1.7vh;letter-spacing:.35vh}
.head h1{color:#ffcc00;font-family:"Frank Ruhl Libre",serif;font-size:6.5vh;font-weight:900;
  line-height:1.05;margin-top:.4vh;text-shadow:0 .3vh 1.4vh rgba(0,0,0,.9)}
.head .ded{color:#ffe9a8;font-size:2vh;margin-top:.5vh}

/* ---------- גוף ---------- */
.body{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:2vh 3vw;gap:1.6vh}
.pname{color:#9fc0e4;font-size:3.4vh;font-weight:800;letter-spacing:.2vh}

/* מצב רשימה */
.list{display:flex;flex-direction:column;align-items:center;gap:.6vh;width:100%}
.li{color:#cfe0f2;font-size:4.6vh;font-weight:700;font-variant-numeric:tabular-nums;
  line-height:1.15;opacity:.55;transition:.4s}
.li.past{opacity:.24;font-size:3.6vh}
.li.now{color:#ffd86b;font-size:10vh;font-weight:900;opacity:1;
  text-shadow:0 0 3.5vh rgba(255,204,0,.6);animation:pulse 2.8s ease-in-out infinite}
@keyframes pulse{0%,100%{text-shadow:0 0 2.4vh rgba(255,204,0,.45)}50%{text-shadow:0 0 5vh rgba(255,204,0,.8)}}
.cdline{color:#ffcc00;font-size:2.8vh;font-weight:800;margin-top:.4vh}

/* מצב ספירה לאחור */
.cdwrap{text-align:center}
.cdwrap .lbl{color:#9fc0e4;font-size:3.2vh;font-weight:700}
.cdwrap .big{color:#ffd86b;font-size:19vh;font-weight:900;line-height:1;
  font-variant-numeric:tabular-nums;text-shadow:0 0 5vh rgba(255,204,0,.5)}
.cdwrap .unit{color:#9fc0e4;font-size:3vh;font-weight:700;margin-top:.6vh}
.cdwrap .at{color:#00ff88;font-size:4.4vh;font-weight:800;margin-top:1.2vh;font-variant-numeric:tabular-nums}

/* מנחה — יעד השקיעה */
.deadline{text-align:center}
.deadline .lbl{color:#9fc0e4;font-size:2.8vh;font-weight:700}
.deadline .big{color:#ff8f6b;font-size:14vh;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;
  text-shadow:0 0 4vh rgba(255,120,80,.45)}
.deadline .sub{color:#ffd86b;font-size:3.4vh;font-weight:800;margin-top:.8vh}
.deadline .roll{color:#cfe0f2;font-size:2.4vh;margin-top:1.4vh;
  border-top:1px solid rgba(255,255,255,.15);padding-top:1.2vh}

.empty{color:#6e7f95;font-size:3.4vh}

/* ---------- תחתית ---------- */
.ft{flex-shrink:0;border-top:1px solid rgba(255,255,255,.1);padding:.8vh 2vw;
  display:flex;align-items:center;justify-content:space-between;gap:1vw;
  color:rgba(255,255,255,.5);font-size:1.4vh}
.ft .mid{text-align:center;flex:1}
.ft .clk{color:#00ff88;font-size:2.2vh;font-weight:700;font-variant-numeric:tabular-nums}
.ft .heb{color:#ffd86b;font-size:1.6vh}
.hide{display:none!important}
@media (max-aspect-ratio: 3/4){
  .head h1{font-size:5vh}
  .li.now{font-size:8vh}
  .cdwrap .big{font-size:14vh}
  .deadline .big{font-size:11vh}
}

<script>/* =====================================================================

     שקיעה / הנץ מוצג  : זווית 90.8333° + תיקון גובה תצפית
     חצות              : מעבר שמש אסטרונומי (לא אמצע היום)

     סוף זמן ק"ש מ"א   : 19.8° (עלות ותצאת 19.8°)
     סוף זמן ק"ש מ"א 72: 16.1°
     צאת הכוכבים       : 8.5° במישור

     הדלקת נרות        : שקיעה (בגובה) − 40 דקות

(function (root) {
  'use strict';

  var RAD = Math.PI / 180, DEG = 180 / Math.PI;
  var EARTH_R = 6356900;           // מ' — ערך KosherJava
  var Z_SUNSET = 90 + 50 / 60;     // 90.833333° — שקיעה/נץ עם רפרקציה

  /* ---------- אסטרונומיה ---------- */

  function julianDay(y, m, d) {
    if (m <= 2) { y -= 1; m += 12; }
    var A = Math.floor(y / 100), B = 2 - A + Math.floor(A / 4);
    return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5;

  function meanLong(t) { var L = 280.46646 + t * (36000.76983 + t * 0.0003032); return ((L % 360) + 360) % 360; }

  function eccent(t) { return 0.016708634 - t * (0.000042037 + 0.0000001267 * t); }

    var m = meanAnom(t) * RAD;
    return Math.sin(m) * (1.914602 - t * (0.004817 + 0.000014 * t))

    return (23.0 + (26.0 + s / 60.0) / 60.0) + 0.00256 * Math.cos((125.04 - 1934.136 * t) * RAD);

    var e = oblCorr(t) * RAD, l = appLong(t) * RAD;
    return Math.asin(Math.sin(e) * Math.sin(l)) * DEG;
  }
  function eqTime(t) {
    var eps = oblCorr(t) * RAD, l0 = meanLong(t) * RAD, e = eccent(t), m = meanAnom(t) * RAD;
    var y = Math.tan(eps / 2); y *= y;
    return (y * Math.sin(2 * l0) - 2 * e * Math.sin(m) + 4 * e * y * Math.sin(m) * Math.cos(2 * l0)
      - 0.5 * y * y * Math.sin(4 * l0) - 1.25 * e * e * Math.sin(2 * m)) * DEG * 4.0;

  /** עיגול ל-QSEC שניות ואז חיתוך לדקה — בדיוק כמו בלוח */

    q = (q === undefined) ? QSEC : q;
    if (!q) return m;
    return Math.round(m * 60 / q) * q / 60;

    if (mins === null || isNaN(mins)) return '--:--';
    opt = opt || {};

  }

  /* ---------- ברירות מחדל למיקומים ---------- */

  var PLACES = {
    jerusalem:  { name: 'ירושלים',   lat: 31.7683, lng: 35.2137, elevation: 754 },
    betshemesh: { name: 'בית שמש',   lat: 31.7500, lng: 34.9750, elevation: 214 }, // נקודת הייחוס של הלוח
    bneibrak:   { name: 'בני ברק',   lat: 32.0840, lng: 34.8330, elevation: 30  },
    telaviv:    { name: 'תל אביב',   lat: 32.0853, lng: 34.7818, elevation: 20  },
    haifa:      { name: 'חיפה',      lat: 32.7940, lng: 34.9896, elevation: 200 },
    beitar:     { name: 'ביתר עילית', lat: 31.6960, lng: 35.1180, elevation: 700 },
    modiin:     { name: 'מודיעין עילית', lat: 31.9310, lng: 35.0420, elevation: 320 },
    ashdod:     { name: 'אשדוד',     lat: 31.8040, lng: 34.6550, elevation: 30  },
    elad:       { name: 'אלעד',      lat: 32.0520, lng: 34.9520, elevation: 120 },
    safed:      { name: 'צפת',       lat: 32.9646, lng: 35.4960, elevation: 850 }

  /* ---------- הגדרות שיטה (ניתנות לשינוי מהאדמין) ---------- */

  var DEFAULTS = {
    lat: 31.7683, lng: 35.2137, elevation: 754,
    timeZone: 'Asia/Jerusalem',
    candleMinutes: 40,        // הדלקת נרות לפני השקיעה
    tzeitDegrees: 8.5,        // צאת הכוכבים
    rtMinutes: 72,            // רבנו תם — דקות שוות אחרי השקיעה בגובה
    mgaDegrees: 19.8,         // מ"א ראשי
    mga72Degrees: 16.1,       // מ"א 72

    useElevationForShaot: false, // הלוח מחשב שעות זמניות במישור
    graHalfDay: false,        // ק"ש/תפילה גר"א לפי יום מלא (כפי שבלוח)
    quantizeSeconds: 15       // הלוח מעגל ל-15 שניות לפני החיתוך לדקה
  };

  function getZmanim(date, cfg) {
    date = date || new Date();
    var c = {};
    for (var k in DEFAULTS) c[k] = DEFAULTS[k];
    if (cfg) for (var k2 in cfg) if (cfg[k2] !== undefined && cfg[k2] !== null) c[k2] = cfg[k2];

    var zMi = Z_SUNSET;                          // מישור

    function ev(zen, rise) { return solarEvent(Y, M, Dd, c.lat, c.lng, tzMin, zen, rise); }
    function deg(x, rise) { return ev(90 + x, rise); }

    var netzMishor = ev(zMi, true);
    var shkiaMishor = ev(zMi, false);
    var netzElev = ev(zEl, true);
    var shkiaElev = ev(zEl, false);
    var chatzot = solarNoon(Y, M, Dd, c.lng, tzMin);

    // שעה זמנית — לפי המישור (כפי שהלוח מחשב)
    var rS = c.useElevationForShaot ? netzElev : netzMishor;
    var sS = c.useElevationForShaot ? shkiaElev : shkiaMishor;
    var shaa = (sS - rS) / 12;
    // שעה זמנית לחצי-היום הבוקר (מהנץ עד חצות אסטרונומי)

    var shaaKS = c.graHalfDay ? shaaAM : shaa;

    // מ"א
    var alotMGA = deg(c.mgaDegrees, true), tzeitMGA = deg(c.mgaDegrees, false);
    var shaaMGA = (tzeitMGA - alotMGA) / 12;
    var alot72 = deg(c.mga72Degrees, true), tzeit72 = deg(c.mga72Degrees, false);

      _meta: { date: Y + '-' + pad(M) + '-' + pad(Dd), tzOffsetMinutes: tzMin, config: c },

      alotHashachar:      alotMGA,                      // עלות השחר 19.8°
      alot72:             alot72,                       // עלות 16.1° (="72")
      misheyakir:         deg(c.misheyakirDegrees, true),
      netzMishor:         netzMishor,                   // הנץ מישורי
      netz:               netzElev,                     // הנץ בגובה התצפית
      sofZmanShmaMGA:     alotMGA + 3 * shaaMGA,
      sofZmanShmaMGA72:   alot72 + 3 * shaa72,
      sofZmanShmaGRA:     rS + 3 * shaaKS,
      sofZmanTfilaMGA:    alotMGA + 4 * shaaMGA,
      sofZmanTfilaGRA:    rS + 4 * shaaKS,
      chatzot:            chatzot,                      // מעבר שמש אסטרונומי
      minchaGedola:       rS + 6.5 * shaa,
      minchaKetana:       rS + 9.5 * shaa,
      plagHamincha:       rS + 10.75 * shaa,
      candleLighting:     shkiaElev - c.candleMinutes,
      shkia:              shkiaElev,                    // השקיעה המוצגת
      shkiaMishor:        shkiaMishor,
      tzeitHakochavim:    deg(c.tzeitDegrees, false),   // 8.5° במישור
      tzeitRT:            shkiaElev + c.rtMinutes,      // ר"ת דקות שוות
      tzeitRTDegrees:     deg(c.mga72Degrees, false),   // ר"ת מעלות
      chatzotLayla:       chatzot + 720,
      shaaZmanitGRA:      shaa,
      shaaZmanitMGA:      shaaMGA

  /** גרסה מפורמטת מוכנה לתצוגה */

    var z = getZmanim(date, cfg), o = { _meta: z._meta };
    for (var k in z) {

      o[k] = fmt(z[k], opt);

    return o;

    getZmanim: getZmanim,
    getZmanimFormatted: getZmanimFormatted,
    fmt: fmt,
    quant: quant,
    PLACES: PLACES,
    DEFAULTS: DEFAULTS,
    _internal: { solarEvent: solarEvent, solarNoon: solarNoon, elevAdj: elevAdj, tzOffsetMinutes: tzOffsetMinutes },

  root.NatiZmanim = API;

  var HUND = ['', 'ק', 'ר', 'ש', 'ת'];

  /** מספר -> גימטריה. מטפל ב-15 ו-16 (טו/טז) ובמאות מעל 400. */
  function gematria(n, punctuate) {
    n = Math.floor(+n);
    if (!n || n < 0) return '';
    var s = '';
    while (n >= 400) { s += 'ת'; n -= 400; }
    if (n >= 100) { s += HUND[Math.floor(n / 100)]; n %= 100; }
    if (n === 15) s += 'טו';
    else if (n === 16) s += 'טז';
    else {
      if (n >= 10) { s += TENS[Math.floor(n / 10)]; n %= 10; }
      if (n > 0) s += ONES[n];
    }
    if (punctuate === false) return s;
    if (s.length === 1) return s + '\u05F3';               // גרש
