<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>נתי SAFE — מסך כניסה</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;800;900&family=Heebo:wght@300;400;500;700;800;900&family=Rubik:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700;1,900&family=Suez+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:Assistant,Arial,sans-serif;background:#05070e;color:#e6edf3;direction:rtl;
  display:flex;flex-direction:column}

/* ---------- כותרת השטיבל ---------- */
.head{flex-shrink:0;text-align:center;padding:2.2vh 2vw 1.8vh;
  background:linear-gradient(135deg,rgba(62,0,0,.97),rgba(30,0,0,.98));
  border-bottom:.35vh solid #ffcc00;box-shadow:0 .6vh 3vh rgba(0,0,0,.7)}
.head .pre{color:rgba(255,204,0,.55);font-size:1.7vh;letter-spacing:.35vh}
.head h1{color:#ffcc00;font-family:"Frank Ruhl Libre",serif;font-size:6.5vh;font-weight:900;
  line-height:1.05;margin-top:.4vh;text-shadow:0 .3vh 1.4vh rgba(0,0,0,.9)}
.head .ded{color:#ffe9a8;font-size:2vh;margin-top:.5vh}
.topbar{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:2.6vw;
  padding:1.6vh 2vw;background:linear-gradient(180deg,rgba(16,24,44,.9),rgba(8,13,26,.9));
  border-bottom:1px solid rgba(255,255,255,.1)}
.topbar .clk{color:#ffd227;font-size:7.4vh;font-weight:800;line-height:1;
  letter-spacing:.02em;font-variant-numeric:tabular-nums;
  text-shadow:0 0 3vh rgba(255,204,0,.5),0 .3vh 1vh rgba(0,0,0,.6)}
.topbar .clk .sec{font-size:.45em;color:#c99a2e;font-weight:700;margin-right:.15em;
  letter-spacing:0;vertical-align:.55em}
.topbar .dts{text-align:right;border-right:1px solid rgba(255,255,255,.18);padding-right:2.6vw}
.topbar .heb{color:#ffd86b;font-size:2.5vh;font-weight:700;letter-spacing:.02em}
.topbar .greg{color:#8fb4dd;font-size:1.6vh;margin-top:.35vh;font-weight:400}
.bl{animation:blk 1s step-end infinite}
.sec2{font-size:.55em;opacity:.85;vertical-align:.12em}
@keyframes blk{0%,49%{opacity:1}50%,100%{opacity:.15}}
#bgimg{position:absolute;inset:0;z-index:0;overflow:hidden}
.bgslide{position:absolute;inset:0;background-size:cover;background-position:center;
  opacity:0;transition:opacity 1.8s ease-in-out}
.bgslide.on{opacity:1}
#bgveil{position:absolute;inset:0;background:rgba(4,8,18,.68);z-index:1}

/* ---------- גוף ---------- */
.body{flex:1;min-height:0;position:relative;overflow:hidden}
.body .inner{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:2vh 3vw;gap:1.6vh}
.pname{color:#ffcc00;font-family:"Frank Ruhl Libre",serif;font-size:11vh;font-weight:900;
  line-height:1;letter-spacing:.02em;text-shadow:0 .4vh 1.6vh rgba(0,0,0,.7)}

/* מצב רשימה */
.list{display:flex;flex-direction:column;align-items:center;gap:.6vh;width:100%}
.li{color:#cfe0f2;font-size:4.6vh;font-weight:700;font-variant-numeric:tabular-nums;
  line-height:1.15;opacity:.55;transition:.4s}
.li.past{opacity:.24;font-size:3.6vh}
.li.now{color:#ffd86b;font-size:10vh;font-weight:900;opacity:1;
  text-shadow:0 0 3.5vh rgba(255,204,0,.6);animation:pulse 2.8s ease-in-out infinite}
@keyframes pulse{0%,100%{text-shadow:0 0 2.4vh rgba(255,204,0,.45)}50%{text-shadow:0 0 5vh rgba(255,204,0,.8)}}
.cdline{color:#ffcc00;font-size:4.6vh;font-weight:900;margin-top:.8vh;font-variant-numeric:tabular-nums}

/* מצב ספירה לאחור */
.cdwrap{text-align:center}
.cdwrap .pray{color:#ffcc00;font-family:"Frank Ruhl Libre",serif;font-size:12vh;font-weight:900;
  line-height:1;letter-spacing:.02em;text-shadow:0 .4vh 1.6vh rgba(0,0,0,.7)}
.cdwrap .lbl{color:#9fc0e4;font-size:4vh;font-weight:700;margin-top:1.2vh}
.cdwrap .big{font-size:19vh;font-weight:900;line-height:1;margin-top:.4vh;
  font-variant-numeric:tabular-nums;transition:color .6s}
.cdwrap .unit{color:#9fc0e4;font-size:3.6vh;font-weight:700;margin-top:.5vh}
.cdwrap .at{color:#00ff88;font-size:7.4vh;font-weight:900;margin-top:1.8vh;
  font-variant-numeric:tabular-nums;text-shadow:0 0 2.4vh rgba(0,255,136,.3)}

/* צבע לפי דחיפות: רחוק = זהב, מתקרב = כתום, ממש קרוב = אדום פועם */
.cd-far  {color:#ffd86b;text-shadow:0 0 4.5vh rgba(255,204,0,.45)}
.cd-soon {color:#ff9d3d;text-shadow:0 0 5vh rgba(255,140,40,.55)}
.cd-now  {color:#ff5f52;text-shadow:0 0 6vh rgba(255,70,60,.65);animation:urg 1.4s ease-in-out infinite}
@keyframes urg{0%,100%{opacity:1}50%{opacity:.62}}

/* מנחה — יעד השקיעה */
.deadline{text-align:center}
.deadline .lbl{color:#9fc0e4;font-size:4.2vh;font-weight:800}
.deadline .big{color:#ff8f6b;font-size:16vh;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;
  text-shadow:0 0 4.5vh rgba(255,120,80,.5)}
.deadline .sub{color:#ffd86b;font-size:5vh;font-weight:900;margin-top:1vh;font-variant-numeric:tabular-nums}
.deadline .roll{color:#fff;font-size:4.4vh;font-weight:800;margin-top:2vh;
  border-top:1px solid rgba(255,255,255,.2);padding-top:1.6vh}

.empty{color:#6e7f95;font-size:3.4vh}

/* ---------- תחתית ---------- */
.ft{flex-shrink:0;border-top:1px solid rgba(255,255,255,.12);padding:1vh 2vw;
  display:flex;align-items:center;justify-content:center;gap:1.4vw;
  color:rgba(255,255,255,.72);font-size:1.9vh;text-align:center}
.ft img{height:5.2vh;width:auto;opacity:.95;filter:drop-shadow(0 0 .8vh rgba(255,204,0,.35))}
.ft b{color:#ffcc00;font-weight:800}
.cdsec{color:#ffcc00;font-size:2.8vh;font-weight:700;margin-top:1.4vh}
.cdsec .num{color:#fff;font-size:4.2vh;font-weight:900;font-variant-numeric:tabular-nums;
  text-shadow:0 0 2.4vh rgba(255,204,0,.5)}
.shrow{display:flex;justify-content:center;gap:5vw;margin-top:2.4vh;
  border-top:1px solid rgba(255,255,255,.15);padding-top:1.8vh}
.shrow>div{text-align:center}
.shrow span{display:block;color:#9fc0e4;font-size:1.9vh;margin-bottom:.4vh}
.shrow b{display:block;color:#ffd86b;font-size:3.6vh;font-variant-numeric:tabular-nums}
.hide{display:none!important}
@media (max-aspect-ratio: 3/4){
  .head h1{font-size:5vh}
  .li.now{font-size:8vh}
  .cdwrap .big{font-size:14vh}
  .deadline .big{font-size:11vh}
}

/* ===== טיפוגרפיה — נתי SAFE ===== */
:root{
  --f-body:"Heebo","Assistant",Arial,sans-serif;
  --f-disp:"Frank Ruhl Libre","David Libre",serif;
  --f-num:"Rubik","Heebo",Arial,sans-serif;
  --gold:#ffd227; --gold-soft:#ffe9a8;
}
body{font-family:var(--f-body)!important;-webkit-font-smoothing:antialiased}
.num,#clock,.topbar .clk,.tm,.cd,.big,.at,.zr b,.prow i,.mt,.mt b{
  font-family:var(--f-num)!important;font-feature-settings:"tnum" 1;font-variant-numeric:tabular-nums}
/* השעון — מוטה קלות, נותן תחושת תנועה ויוקרה */
#clock,.topbar .clk{
  font-family:var(--f-num)!important;font-weight:800!important;
  transform:skewX(-6deg);display:inline-block;
  background:linear-gradient(180deg,#d9ffe9 0%,#00ff88 45%,#00a85c 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 .25vh .8vh rgba(0,0,0,.55)) drop-shadow(0 0 2.4vh rgba(0,255,136,.4))}
#clock .sec,.topbar .clk .sec,.topbar .clk .sec2{
  font-size:.4em!important;-webkit-text-fill-color:#5fbf90;background:none;filter:none;
  vertical-align:.62em;margin-right:.14em;font-weight:700}
/* כותרות — סריף כבד עם עומק */
.head h1,.ttl b,.bigttl,.mcard .rn,.room .rn,.sc .nm,.cdwrap .pray,.hdr{
  font-family:var(--f-disp)!important}
.head h1,.ttl b,.bigttl{
  background:linear-gradient(180deg,#fff3c9 0%,#ffcc00 55%,#c98f10 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 .3vh 1vh rgba(0,0,0,.65))}
.hdr{font-family:var(--f-body)!important;letter-spacing:.06em}
/* כרטיסים — עומק עדין */
.mcard,.room,.sc,.ann{box-shadow:0 .6vh 2.2vh rgba(0,0,0,.45),inset 0 .1vh 0 rgba(255,255,255,.06)}

</style></head><body>
